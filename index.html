<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZebraOs</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2">
<meta name="theme-color" content="#102431">
<link rel="stylesheet" href="style.css?v=6.8">
<link rel="stylesheet" href="zebra-hardware.css?v=1.0">
<link rel="stylesheet" href="zebra-notes.css?v=1.0">
<link rel="stylesheet" href="zebra-tools.css?v=1.0">
<link rel="stylesheet" href="desktop-layout.css?v=1.0">
<link rel="stylesheet" href="media-thumbnails.css?v=1.1">
<link rel="stylesheet" href="folder-views.css?v=1.0">
<link rel="stylesheet" href="zebra-video.css?v=1.1">
<link rel="stylesheet" href="zebra-photos.css?v=1.2">
<link rel="stylesheet" href="zebraamp-compact.css?v=4.1">
<link rel="stylesheet" href="zebravis-controls.css?v=1.1">
<link rel="stylesheet" href="zebraamp-phosphor.css?v=1.0">
<link rel="stylesheet" href="zebraamp-faders.css?v=1.0">
<link rel="stylesheet" href="zebraamp-skin.css?v=1.1">
</head>
<body>
<div id="power-screen" class="screen active">
  <button id="power-btn" class="zboot-power" aria-label="Allumer ZebraOS">
    <span class="zboot-power-symbol" aria-hidden="true">
      <svg class="zboot-power-svg" viewBox="0 0 64 64" width="64" height="64"
           xmlns="http://www.w3.org/2000/svg" fill="none">
        <path d="M20 14 A23 23 0 1 0 44 14" stroke="currentColor" stroke-width="6"
              stroke-linecap="round"/>
        <path d="M32 5 V30" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="zboot-power-label">ALLUMER</span>
  </button>
</div>
<div id="boot-screen" class="screen" aria-label="Démarrage de ZebraOS">
  <div class="zboot-logo-frame"><img class="zboot-logo"  alt="ZebraOS" /></div>
  <button id="skip-boot" class="zboot-skip" aria-label="Passer l'animation de démarrage">PASSER L’INTRO &gt;</button>
</div>
<div id="session-boot-screen" class="screen" aria-label="Ouverture de session">
  <div class="zboot-session-content">
    <img class="zboot-session-logo"  alt="ZebraOS" />
    <span id="zboot-session-label">OUVERTURE DE SESSION</span>
  </div>
  <button id="skip-session-boot" class="zboot-skip" aria-label="Passer l'ouverture de session" >PASSER &gt;</button>
</div>
<div id="login-screen" class="screen">
  <div class="login-top-band" aria-hidden="true"></div>
  <main class="login-content">
    <div class="login-header">
      <img class="login-brand-logo" src="/assets/boot/logo.png" alt="ZebraOS">
    </div>
    <p class="login-prompt">Pour commencer, cliquez sur votre nom d’utilisateur.</p>
    <div id="login-users" class="login-users" aria-label="Choix de la session"></div>
  </main>
  <div class="login-footer">
    <div class="login-power-actions">
      <button id="restart-login" class="login-power-button" type="button">↻ <span>Redémarrer</span></button>
      <button id="shutdown-login" class="login-power-button" type="button">⏻ <span>Éteindre l’ordinateur</span></button>
    </div>
  </div>
</div>
<div id="desktop-screen" class="screen">
  <div id="wallpaper" class="wallpaper wallpaper-visitor"><div class="wallpaper-grain"></div><div class="wallpaper-label">ZEBRA TAPE 2 <span>STUDIO // 2026</span></div></div>
  <div id="desktop-icons" class="desktop-icons"></div>
  <div id="windows-area"></div>
  <div id="start-menu" class="start-menu hidden"><div class="start-side">ZebraOS <b>2.0</b></div><div class="start-options"><button data-start="amp">▣ <span>ZebraAMP</span></button><button data-start="explorer">▤ <span>Poste de travail</span></button><hr><button data-start="folder:games">▦ <span>Jeux</span></button><button data-start="folder:tools">▤ <span>Outils</span></button><hr><button data-start="settings">⚙ <span>Réglage de l’ordinateur</span></button><button data-start="about">ⓘ <span>Propriétés du système</span></button><hr><button id="logout">⇥ <span>Fermer la session</span></button><button id="shutdown-desktop">⏻ <span>Éteindre</span></button></div></div>
  <div class="taskbar"><button id="start-button" class="win-button start-button"><span class="start-z">Z</span> Démarrer</button><div id="task-items"></div><div class="tray"><span class="tray-icon" title="Réseau du studio ZebraOS">◉</span><span id="clock"></span></div></div>
</div>
<input type="file" id="file-wallpaper" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" hidden>
<input type="file" id="file-music" accept="audio/*" multiple hidden>
<script src="sfx.js?v=0.4"></script>
<script src="assets/icons-pack.js?v=0.6"></script>
<script src="assets/boot-assets-v07.js?v=0.7"></script>
<script src="wallpaper.js?v=1.3"></script>
<script src="zebra-video.js?v=1.2"></script>
<script src="zebra-photos.js?v=1.3"></script>
<script src="zebra-notes.js?v=1.0"></script>
<script src="github-files.js?v=4.9"></script>
<script src="filesystem.js?v=3.1"></script>
<script src="visualizer.js?v=4.4"></script>
<script src="zebraamp.js?v=4.7"></script>
<script src="control-panel.js?v=1.2"></script>
<script src="zebra-tools.js?v=1.1"></script>
<script src="desktop-layout.js?v=1.0"></script>
<script src="app.js?v=8.8"></script>
<script>
/* Cache local léger : JS/CSS seulement ; jamais le HTML, les photos ou les MP4. */
if("serviceWorker" in navigator && location.protocol==="https:"){
 window.addEventListener("load",function(){
  navigator.serviceWorker.register("/sw.js",{updateViaCache:"none"}).catch(function(){});
 },{once:true});
}
</script>
</body>
</html>
