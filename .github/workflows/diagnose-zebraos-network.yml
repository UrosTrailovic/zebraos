name: Diagnostic ZebraOS — accès public
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Configuration réelle GitHub Pages et état TLS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '==== API GitHub Pages (domaine et certificat) ===='
          curl --fail-with-body -sSL --max-time 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/UrosTrailovic/zebraos/pages" \
            | jq '{cname,https_enforced,https_certificate,public,status,build_type}'
      - name: Test de secours Github.io en navigateur
        shell: bash
        run: |
          set +e
          echo '=== HTTP(S) fallback and critical assets ==='
          for u in https://urostrailovic.github.io/zebraos/ https://urostrailovic.github.io/zebraos/app.js?v=10.0 https://urostrailovic.github.io/zebraos/assets/boot/logo.png; do
            curl -sS -L -I --connect-timeout 7 --max-time 12 -o /dev/null -w 'FALLBACK_HTTP=%{http_code} DEST=%{url_effective} VERIFY=%{ssl_verify_result}\\n' "$u"
          done
          echo '=== Chrom(e|ium) screenshot DOM test ==='
          BROWSER=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$BROWSER" ]; then
            timeout 20 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom https://urostrailovic.github.io/zebraos/ > /tmp/zebra-fallback.html 2>/tmp/zebra-fallback-err.log
            echo 'CHROME_STATUS='$?
            grep -o '<base href="/zebraos/"' /tmp/zebra-fallback.html | head -n 1
            grep -o '<button id="power-btn"' /tmp/zebra-fallback.html | head -n 1
            head -c 200 /tmp/zebra-fallback.html
            echo
            grep -iE 'ERROR|net::|ERR_' /tmp/zebra-fallback-err.log | tail -n 8
          fi
      - name: DNS, HTTPS et navigateur Chromium
        shell: bash
        run: |
          set +e
          echo "==== DNS public ===="
          for host in zebratape2.net www.zebratape2.net urostrailovic.github.io; do
            echo "DNS $host"; dig +time=4 +tries=1 +short "$host" A; dig +time=4 +tries=1 +short "$host" AAAA; dig +time=4 +tries=1 +short "$host" CNAME
          done
          echo "==== Requêtes HTTP(S) externes ===="
          for url in https://zebratape2.net/ https://www.zebratape2.net/ http://zebratape2.net/ http://www.zebratape2.net/ https://urostrailovic.github.io/zebraos/; do
            echo "URL $url"; curl -sS -L -I -v --connect-timeout 7 --max-time 14 -o /dev/null -w 'HTTP %{http_code} IP %{remote_ip} URL_FINAL %{url_effective} SSL_VERIFY %{ssl_verify_result}\n' "$url" 2>&1 | tail -n 14
          done
          echo "==== Pages GitHub, route forcée au serveur officiel ===="
          for name in zebratape2.net www.zebratape2.net; do
            curl -sS -I --resolve "$name:443:185.199.108.153" --connect-timeout 5 --max-time 9 -w 'HTTP %{http_code} SSL_VERIFY %{ssl_verify_result}\n' "https://$name/" | head -n 14
          done
          echo "==== Chrome en mode headless ===="
          BROWSER=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$BROWSER" ]; then
            timeout 18 "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --ignore-certificate-errors --disable-extensions --virtual-time-budget=3500 --dump-dom https://www.zebratape2.net/ >/tmp/zebra-browser.html 2>/tmp/zebra-browser.log
            echo "Browser exit: $?"
            head -c 420 /tmp/zebra-browser.html
            echo
            tail -n 12 /tmp/zebra-browser.log
          fi
          echo "==== FIN DIAGNOSTIC ===="
