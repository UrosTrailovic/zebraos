name: Vérifier navigateur sur domaine ZebraOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Installer le test Playwright
        run: python3 -m pip install --quiet playwright
      - name: Tester zebratape2.net depuis Chrome mobile
        run: |
          cat > /tmp/test_zebra_fallback.py <<'PY'
          import json,sys,time
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-dev-shm-usage'])
              page=browser.new_page(viewport={'width':390,'height':844},device_scale_factor=1,is_mobile=True,has_touch=True)
              errors=[];failed=[]
              page.on('pageerror',lambda exc: errors.append(str(exc)))
              page.on('requestfailed',lambda req: failed.append({'url':req.url,'error':req.failure}))
              url='https://www.zebratape2.net/'
              response=page.goto(url,wait_until='domcontentloaded',timeout=40000)
              page.wait_for_timeout(3500)
              state=page.evaluate("""() => ({
                  url:location.href,base:document.baseURI,title:document.title,
                  powered:!!document.querySelector('#power-btn'),
                  powerVisible:!!document.querySelector('#power-btn')?.getClientRects().length,
                  hasDesktop:!!document.querySelector('#desktop-screen'),
                  images:[...document.images].slice(0,8).map(x=>({url:x.currentSrc||x.src,ok:x.complete&&x.naturalWidth>0})),
                  scriptCount:[...document.scripts].filter(s=>s.src).length,
                  appScript:[...document.scripts].find(s=>s.src.includes('/app.js'))?.src
              })""")
              print('MAIN_HTTP',response.status if response else None,flush=True)
              print('MOBILE_STATE',json.dumps({k:v for k,v in state.items() if k!='images'},ensure_ascii=False),flush=True)
              print('IMAGE_LOADS',json.dumps([{'ok':z['ok'],'url':z['url'][:120]} for z in state['images']],ensure_ascii=False),flush=True)
              print('PAGE_ERRORS',json.dumps(errors[:12],ensure_ascii=False),flush=True)
              print('FAILED_REQUESTS',json.dumps(failed[:20],ensure_ascii=False),flush=True)
              assert not page.locator('#zboot-cinematic-video').count(), 'startup video should be removed'
              assert not page.locator('#zboot-audio-btn').count(), 'movie sound button should be removed'
              assert state['powered'] and state['powerVisible'], 'power control unavailable'
              page.locator('#power-btn').click(timeout=5000)
              page.wait_for_timeout(250)
              boot=page.evaluate("""() => ({
                power:document.querySelector('#power-screen')?.className,
                boot:document.querySelector('#boot-screen')?.className
              })""")
              print('ORIGINAL_BOOT',boot,flush=True)
              assert 'active' not in boot['power'] and 'active' in boot['boot'], 'original boot did not start immediately'
              page.screenshot(path='/tmp/zebra-fallback.png')
              browser.close()
              assert response and response.status==200, 'HTML not served'
              assert state['base'].startswith('https://www.zebratape2.net/'), 'wrong canonical domain'
              assert state['powered'] and state['hasDesktop'], 'ZebraOS shell missing'
              assert state['scriptCount']>5 and state['appScript'], 'JS assets missing'
              assert not errors, 'Unexpected page errors'
          PY
          python3 /tmp/test_zebra_fallback.py
