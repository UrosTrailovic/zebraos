name: Vérifier Zebra Snake
on:
  push:
    paths:
      - snake.js
      - snake.css
      - assets/games/snake/**
      - assets/fonts/zebra-videotex.woff
      - assets/fonts/redden.woff
      - tests/snake.test.cjs
      - .github/workflows/verify-snake-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check snake.js && node --test tests/snake.test.cjs
      - name: Plateau et commandes sur mobile et bureau
        run: |
          cat > _verify_snake.html <<'HTML'
          <!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="snake.css"><style>html,body{margin:0;width:100%;height:100%}#test{position:fixed;inset:0;display:block;width:100%;height:100%;padding:0}</style><div id="test" class="window-body zebra-game-body"></div><script src="snake.js"></script><script>
          window.addEventListener('load',async()=>{
           const out={},host=document.querySelector('#test'),wait=ms=>new Promise(r=>setTimeout(r,ms));
           const loaded=async image=>{for(let i=0;i<80;i++){if(image.complete&&image.naturalWidth)return;await wait(25);}throw Error('Image non chargée : '+image.src);};
           try{
            localStorage.setItem('zebra.snake.theme','night');ZebraSnake.mount(host);await wait(150);
            const $=q=>host.querySelector(q),stage=$('.zs-stage'),bounds=stage.getBoundingClientRect(),consoleBounds=$('.zs-console').getBoundingClientRect();
            const hudBounds=$('.zs-hud').getBoundingClientRect();out.hudAligned=Math.abs(hudBounds.left-bounds.left)<1&&Math.abs(hudBounds.right-bounds.right)<1;
            out.fits=bounds.width>100&&bounds.height>90&&bounds.left>=0&&bounds.right<=innerWidth&&consoleBounds.bottom<=innerHeight+1;
            const ctx=$('canvas').getContext('2d');out.drawn=ctx.getImageData(160,160,1,1).data[3]===255;
            const image=new Image();image.src='/assets/games/snake/tileSnake.png';await loaded(image);out.tile=image.naturalWidth===32&&getComputedStyle($('.zs-machine')).backgroundImage.includes('tileSnake');
            await Promise.race([document.fonts.load('16px "Zebra Videotex"'),wait(2000)]);
            out.font=document.fonts.check('16px "Zebra Videotex"');
            const clean=e=>{const s=getComputedStyle(e);return s.backgroundColor==='rgba(0, 0, 0, 0)'&&s.backgroundImage==='none'&&s.boxShadow==='none'&&s.borderTopWidth==='0px'};
            out.logo=$('.zs-logo').getAttribute('src').includes('znaklogo.png')&&$('.zs-header').getBoundingClientRect().bottom<=hudBounds.top;
            const logo=$('.zs-logo');await loaded(logo);out.logoLoaded=logo.naturalWidth>0;
            out.bare=clean($('.zs-hud'))&&clean($('.zs-console'))&&clean(stage)&&clean($('.zs-overlay'));
            out.noBricks=$('canvas').width===384&&$('canvas').height===384;
            out.square=Math.abs(bounds.width-bounds.height)<1;
            await Promise.race([document.fonts.load('36px Redden'),wait(2000)]);out.redden=document.fonts.check('36px Redden');
            out.launch=!$('.zs-launch').hidden&&$('.zs-launch h1').textContent==='Znake';
            $('.zs-level-prev').click();out.levelWrap=$('.zs-level-value').textContent==='4';$('.zs-level-next').click();$('.zs-level-next').click();out.levelSelect=$('.zs-level-value').textContent==='2';
            $('.zs-play').click();out.soloDuel=$('.zs-best-label').textContent==='ORDI';$('.zs-menu').click();
            $('[data-players="2"]').click();$('.zs-play').click();await wait(40);
            out.duo=$('.zs-machine').dataset.duo==='true'&&$('.zs-best-label').textContent==='J2';
            if(matchMedia('(hover:none),(pointer:coarse)').matches){
             const top=$('.zs-second-pad').getBoundingClientRect(),bottom=$('.zs-cross').getBoundingClientRect(),board=stage.getBoundingClientRect();
             out.faceToFace=top.height>=110&&top.bottom<=board.top&&bottom.top>=board.bottom&&Math.abs(board.width-board.height)<1&&top.top>=0&&bottom.bottom<=innerHeight;
             out.inverted=getComputedStyle($('.zs-second-pad')).transform.startsWith('matrix(-1,');
             out.duoHitTargets=Array.from(host.querySelectorAll('.zs-dir,.zs-p2-dir')).every(b=>b.getBoundingClientRect().width>=38&&b.getBoundingClientRect().height>=38);
            }
            $('.zs-up').dispatchEvent(new PointerEvent('pointerdown',{button:0,bubbles:true}));$('.zs-p2-up').dispatchEvent(new PointerEvent('pointerdown',{button:0,bubbles:true}));await wait(150);$('.zs-play').click();
            const inkAt=(x,y,blue)=>{const pixels=ctx.getImageData(x*16,y*16,16,16).data;for(let i=0;i<pixels.length;i+=4)if(blue?pixels[i+2]>180&&pixels[i+2]>pixels[i+1]:pixels[i]>180&&pixels[i+1]>150&&pixels[i+2]>120)return true;return false;};
            out.independentTouch=inkAt(6,5,false)&&inkAt(17,14,true);
            $('.zs-menu').click();$('[data-players="1"]').click();$('.zs-mode').click();
            out.ready=$('.zs-state').textContent==='PRÊT';
            document.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true}));out.spaceStart=$('.zs-state').textContent==='EN JEU'&&$('.zs-overlay').hidden;
            document.dispatchEvent(new KeyboardEvent('keydown',{key:' ',repeat:true,bubbles:true}));out.spaceHeld=$('.zs-state').textContent==='EN JEU';
            $('.zs-menu').click();
            const ground=ctx.getImageData(0,0,1,1).data;out.groveOnly=!$('.zs-themes')&&!$('.zs-theme')&&ground[1]>100&&ground[0]<70&&ground[2]<70;
            $('.zs-play').click();out.play=$('.zs-state').textContent==='EN JEU'&&$('.zs-overlay').hidden;
            $('.zs-play').click();out.pause=$('.zs-state').textContent==='PAUSE'&&!$('.zs-overlay').hidden;
            out.pauseTitle=$('.zs-overlay strong').textContent==='PAUSE'&&parseFloat(getComputedStyle($('.zs-overlay strong')).fontSize)>=24;
            $('.zs-menu').click();$('.zs-up').dispatchEvent(new PointerEvent('pointerdown',{button:0,bubbles:true}));out.menuDpad=$('.zs-state').textContent==='PRÊT';$('.zs-play').click();$('.zs-up').dispatchEvent(new PointerEvent('pointerdown',{button:0,bubbles:true}));out.direction=$('.zs-state').textContent==='EN JEU';
            document.dispatchEvent(new KeyboardEvent('keydown',{key:' ',code:'Space',bubbles:true}));out.keyboard=$('.zs-state').textContent==='PAUSE';
            $('.zs-restart').click();out.restart=$('.zs-state').textContent==='EN JEU'&&$('.zs-score').textContent==='0000';
            out.mobile=innerWidth>700||getComputedStyle($('.zs-handheld')).display==='grid';
            if(innerWidth<=700){
             // A Tetris DOM fixture uses its real production CSS at the same size.
             const ref=document.createElement('div');ref.className='window-body zebra-game-body';ref.style.cssText='position:fixed;left:-10000px;top:0;padding:0;width:'+host.clientWidth+'px;height:'+host.clientHeight+'px';
             const retro=document.createElement('div');retro.className='zg zg-retro';
             const fill=document.createElement('div');fill.style.cssText='flex:1;min-height:0';
             const clone=$('.zs-handheld').cloneNode(true);
             for(const e of [clone,...clone.querySelectorAll('[class]')])e.className=e.className.split(' ').filter(c=>!c.startsWith('zs-')).join(' ');
             retro.append(fill,clone);ref.append(retro);document.body.append(ref);
             const origin=host.getBoundingClientRect(),refOrigin=ref.getBoundingClientRect();
             const pairs=[['.zs-cross','.zt-cross'],['.zs-up','.zt-dir-up'],['.zs-down','.zt-dir-down'],['.zs-left','.zt-dir-left'],['.zs-right','.zt-dir-right'],['.zs-a','.zt-a'],['.zs-b','.zt-b']];
             out.tetrisGeometry=pairs.every(([a,b])=>{
              const actual=$(a).getBoundingClientRect(),expected=ref.querySelector(b).getBoundingClientRect();
              return Math.abs(actual.width-expected.width)<1&&Math.abs(actual.height-expected.height)<1&&Math.abs((actual.left-origin.left)-(expected.left-refOrigin.left))<1&&Math.abs((actual.top-origin.top)-(expected.top-refOrigin.top))<1;
             });
             out.diagonal=$('.zs-a').getBoundingClientRect().top<$('.zs-b').getBoundingClientRect().top;
             out.visibleControls=Array.from(host.querySelectorAll('.zs-dir,.zs-ab button')).every(b=>{const r=b.getBoundingClientRect();const s=getComputedStyle(b);return r.width>=30&&r.height>=30&&r.left>=0&&r.right<=innerWidth&&s.color!=='rgba(0, 0, 0, 0)'});
             out.noControlPanel=getComputedStyle($('.zs-handheld'),'::before').display==='none';
             ref.remove();
            }
            await wait(2250);
            out.impact=$('.zs-machine').dataset.state==='hurt'&&$('.zs-overlay').hidden;
            document.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true}));out.lockedImpact=$('.zs-machine').dataset.state==='hurt';
            await wait(2100);
            out.gameoverTitle=$('.zs-state').textContent==='GAME OVER'&&$('.zs-overlay strong').textContent==='GAME OVER';
            out.restartCaption=$('.zs-overlay span').textContent==='Appuyer sur espace pour recommencer';
            out.redTitle=getComputedStyle($('.zs-overlay strong')).color==='rgb(255, 38, 61)';
            out.gameoverBlink=getComputedStyle($('.zs-overlay strong')).animationName.includes('zs-gameover');
            out.gameoverFont=getComputedStyle($('.zs-overlay strong')).fontFamily.includes('Redden');
            out.gameoverSize=parseFloat(getComputedStyle($('.zs-overlay strong')).fontSize)>=24;
            document.dispatchEvent(new KeyboardEvent('keydown',{key:' ',bubbles:true}));out.replay=$('.zs-state').textContent==='EN JEU'&&$('.zs-overlay').hidden;
            host._zebraDispose();await wait(320);out.dispose=$('.zs-state').textContent==='EN JEU';
           }catch(e){out.error=String(e.stack||e)}
           document.documentElement.dataset.snakeReport=JSON.stringify(out);document.documentElement.dataset.snakeStatus=Object.values(out).every(v=>v===true)?'ok':'failed';
          });
          </script>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/snake-server.log 2>&1 &
          sleep 1
          for size in 390,740 1160,900; do
            google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=$size --virtual-time-budget=24000 --dump-dom http://127.0.0.1:8765/_verify_snake.html > /tmp/snake-$size.html 2>/tmp/snake-$size.log
            grep -o 'data-snake-report="[^"]*"' /tmp/snake-$size.html
            grep -q 'data-snake-status="ok"' /tmp/snake-$size.html
          done
