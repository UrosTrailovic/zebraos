name: Vérifier utilitaires ZebraOS
on:
  push:
    paths:
      - 'zebra-tools.js'
      - 'zebra-tools.css'
      - 'github-files.js'
      - 'folder-views.css'
      - 'media-thumbnails.css'
      - 'desktop-layout.js'
      - 'desktop-layout.css'
      - 'app.js'
      - 'control-panel.js'
      - 'index.html'
      - 'STUDIO/BUREAU/**'
      - 'assets/bureau-index.json'
      - '.github/workflows/verify-zebra-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  applications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe et les raccourcis GitHub
        run: |
          node --check zebra-tools.js
          node --check github-files.js
          node --check desktop-layout.js
          node --check app.js
          node --check control-panel.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('STUDIO/BUREAU')
          index=json.loads(Path('assets/bureau-index.json').read_text())
          entries=index['entries']
          config=json.loads(Path('STUDIO/BUREAU/.ordre-bureau.json').read_text())
          assert index['desktopOrder']==config['ordre'],"Ordre non synchronisé avec GitHub"
          root_items={e.get('name') or Path(e['path']).name for e in entries if Path(e['path']).parent==root}
          assert set(index['desktopOrder'])<=root_items,"Raccourci inconnu dans l'ordre par défaut"
          assert all(root in Path(e['path']).parents for e in entries)
          for item in entries:
              if item['type']=='app':
                  assert Path(item['path']).is_file(),item
                  assert json.loads(Path(item['path']).read_text())['app']==item['app']
          names=[e['path'] for e in entries]
          for name in ['Jeux','Outils','Zebra Tape 2','sadate']:
              assert 'STUDIO/BUREAU/'+name in names,name
          for item in entries:
              if item['type']=='app' and item['app']=='settings':
                  assert item['path'].startswith('STUDIO/BUREAU/Réglage'),item
          print('Structure GitHub : OK,',len(entries),'entrées')
          PY
      - name: Tester bureau, dossiers et trois utilitaires dans Chromium
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page=Path('index.html').read_text()
          script=r'''<script>
          window.addEventListener("load",async function(){
           var report={};
           async function waitUntil(check,label){
            for(var attempt=0;attempt<100;attempt++){
             if(check())return;await new Promise(resolve=>setTimeout(resolve,25));
            }
            throw Error(label);
           }
           async function waitImage(image){
            await waitUntil(()=>image.complete&&image.naturalWidth>0,"Icône non chargée : "+image.src);
           }
           try{
            var tools=window.ZebraTools,lib=window.ZebraGitFiles;
            report.loaded=!!tools&&!!lib;
            document.getElementById("power-btn").click();
            document.getElementById("skip-boot").click();
            document.querySelector(".user-visitor").click();
            document.getElementById("skip-session-boot").click();
            var result=await lib.load();
            report.indexLoaded=result.ok&&lib.list(lib.root).some(x=>x.name==="Outils");
            var existingPhoto=lib.allFiles().find(x=>x.type==="file"&&/\.(jpg|png|webp)$/i.test(x.name)
              &&x.path.includes("Photo et vidéo cool/")&&!x.name.includes("icone."));
            report.photoInRepo=!!existingPhoto;
            if(existingPhoto){
              var thumb=lib.icon(existingPhoto,function(){return document.createElement("i");},32);
              thumb.style.position="absolute";thumb.style.left="4px";thumb.style.top="4px";
              document.getElementById("desktop-screen").appendChild(thumb);
              var photo=thumb.querySelector(".bureau-media-image");
              report.photoThumbnailElement=!!photo&&thumb.classList.contains("bureau-media-thumb");
              if(photo){
                photo.loading="eager";
                try{
                  await Promise.race([photo.decode().catch(()=>{}),
                    new Promise(resolve=>setTimeout(resolve,1600))]);
                }catch(e){}
                report.photoThumbnailLoaded=photo.naturalWidth>0;
                report.photoFrameStyled=getComputedStyle(thumb).borderStyle!=="none";
              }else report.photoThumbnailLoaded=false;
              thumb.remove();
            }else{
              report.photoThumbnailElement=false;report.photoThumbnailLoaded=false;
            }
            var demoVideo={type:"file",path:"STUDIO/BUREAU/Photo et vidéo cool/Vidéo/demo.mp4",name:"demo.mp4",size:50000000};
            var videoThumb=lib.icon(demoVideo,function(){return document.createElement("i");},32);
            report.videoThumbnail=!!videoThumb.querySelector(".bureau-video-play")
              &&videoThumb.classList.contains("bureau-video-thumb");
            report.configOrder=lib.list(lib.root).slice(0,3).map(e=>e.name).join("|")
              ==="Réglage de l’ordinateur|ZebraAMP.exe|Jeux";
            await new Promise(resolve=>setTimeout(resolve,160));
            var icons=Array.from(document.querySelectorAll(".desk-icon .desk-caption")).map(e=>e.textContent);
            report.desktop=["Jeux","Outils","Zebra Tape 2","sadate","ZebraAMP.exe","Réglage de l’ordinateur"].every(n=>icons.includes(n))
              &&!icons.includes("Poste de travail")&&!icons.includes("ATELIER")&&!icons.includes("Tetris.exe")&&!icons.includes("Znak.exe")
              &&icons.includes("Corbeille")&&!icons.includes("Gestionnaire Studio");
            function desk(label){return Array.from(document.querySelectorAll(".desk-icon")).find(e=>e.querySelector(".desk-caption")?.textContent===label);}
            function entry(label){return Array.from(document.querySelectorAll(".github-file-entry")).find(e=>e.querySelector(".github-file-name")?.textContent===label);}
            function button(label,element){return Array.from(element.querySelectorAll("button")).find(e=>e.textContent.trim().includes(label));}
            report.thanksLast=lib.list(lib.root).slice(-1)[0].name==="thanks.txt";
            desk("Réglage de l’ordinateur").click();
            var panel=document.querySelector(".zcp");
            report.welcomeFirst=!!panel&&panel.querySelector(".zcp-item-title").textContent==="Bienvenu";
            report.settingsTitle=panel.closest(".window").querySelector(".windowtitle").textContent==="Réglage de l’ordinateur";
            var bin=document.querySelector(".zu-trash-icon");
            var binRect=bin.getBoundingClientRect();
            report.fixedTrash=binRect.right>=innerWidth-25&&binRect.bottom<=innerHeight-34
              &&binRect.bottom>=innerHeight-55;
            report.onlyOneBin=document.querySelectorAll(".zu-trash-icon").length===1;
            function dragIcon(node,targetX,targetY){
              var r=node.getBoundingClientRect(),x=r.left+15,y=r.top+15;
              function ev(type,cx,cy){return new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:101,pointerType:"touch",isPrimary:true,button:0,clientX:cx,clientY:cy});}
              node.dispatchEvent(ev("pointerdown",x,y));
              window.dispatchEvent(ev("pointermove",targetX,targetY));
              window.dispatchEvent(ev("pointerup",targetX,targetY));
            }
            var movable=desk("ZebraAMP.exe"),originalLeft=parseFloat(movable.style.left)||0;
            dragIcon(movable,movable.getBoundingClientRect().left+65,movable.getBoundingClientRect().top+70);
            report.iconMove=Math.abs(parseFloat(movable.style.left)-originalLeft)>=20;
            var positionData=JSON.parse(localStorage.getItem("zebra.desktop.v1.visitor"));
            report.iconSave=!!positionData.positions.narrow["STUDIO/BUREAU/ZebraAMP.exe.zebraos.json"];
            var trashRect=bin.getBoundingClientRect();
            dragIcon(movable,(trashRect.left+trashRect.right)/2,(trashRect.top+trashRect.bottom)/2);
            report.trashPersist=JSON.parse(localStorage.getItem("zebra.desktop.v1.visitor")).trash.includes("STUDIO/BUREAU/ZebraAMP.exe.zebraos.json");
            report.trashHides=!desk("ZebraAMP.exe");
            bin.click();
            report.trashWindow=!!document.querySelector(".zu-trash-list");
            var restore=Array.from(document.querySelectorAll(".zu-trash-item button")).find(e=>e.textContent.includes("RESTAURER"));
            restore.click();
            report.trashRestore=!!desk("ZebraAMP.exe")&&JSON.parse(localStorage.getItem("zebra.desktop.v1.visitor")).trash.length===0;
            desk("Jeux").click();
            await new Promise(resolve=>setTimeout(resolve,150));
            report.gamesFolder=!!entry("Tetris.exe")&&!!entry("Znak.exe")
              &&!entry("ZebraCalc.exe");
            document.documentElement.dataset.zebraPhase="folder-ready";
            await waitUntil(()=>Array.from(document.querySelectorAll(".github-drive-toolbar button")).some(b=>b.textContent.includes("Actualiser")&&!b.disabled),"Actualisation du dossier inachevée");
            document.documentElement.dataset.zebraPhase="folder-views";
            const viewSelect=document.querySelector(".folder-view-select"),desktopWidth=desk("Jeux").querySelector("img").getBoundingClientRect().width;
            report.folderViews=Array.from(viewSelect.options).map(o=>o.textContent).join("|")==="Petites icônes|Icônes moyennes|Grandes icônes|Liste";
            report.folderSizes=true;
            for(const [view,px] of [["small",24],["medium",32],["large",64],["list",20]]){
             viewSelect.value=view;viewSelect.dispatchEvent(new Event("change"));
             const grid=document.querySelector(".github-drive-list"),icon=entry("Znak.exe").querySelector(".bureau-custom-icon");
             report.folderSizes=report.folderSizes&&grid.dataset.view===view&&Math.abs(icon.getBoundingClientRect().width-px)<1;
            }
            report.folderList=getComputedStyle(entry("Znak.exe")).display==="grid"&&getComputedStyle(document.querySelector(".github-drive-list")).display==="flex";
            report.desktopSizeUntouched=desk("Jeux").querySelector("img").getBoundingClientRect().width===desktopWidth;
            viewSelect.value="large";viewSelect.dispatchEvent(new Event("change"));
            report.folderViewSaved=localStorage.getItem("zebraos.folder-view.v1.visitor")==="large";
            const znakEntry=entry("Znak.exe"),znakIcon=znakEntry.querySelector(".bureau-custom-icon");
            document.documentElement.dataset.zebraPhase="folder-icon";await waitImage(znakIcon);report.znakFolderIcon=znakIcon.naturalWidth===64;
            document.documentElement.dataset.zebraPhase="znak-load";znakEntry.click();await window.ZebraLazyApps.load("snake");
            await new Promise(resolve=>setTimeout(resolve,100));
            const znakWindow=document.querySelector(".zs-machine").closest(".window");
            report.znakName=znakWindow.querySelector(".windowtitle").textContent==="Znak.exe";
            const titleIcon=znakWindow.querySelector(".titlebar img.os-icon-graphic");await waitImage(titleIcon);
            report.znakTitleIcon=titleIcon.naturalWidth===64;
            entry("Tetris.exe").click();
            // Le moteur n'est téléchargé qu'au premier lancement.
            await window.ZebraLazyApps.load("tetris");
            await new Promise(resolve=>setTimeout(resolve,100));
            report.tetrisWorks=!!document.querySelector(".zg-tetris-stage");
            desk("Outils").click();
            await new Promise(resolve=>setTimeout(resolve,150));
            report.folderViewRetained=document.querySelector(".folder-view-select").value==="large"&&document.querySelector(".github-drive-list").dataset.view==="large";
            report.toolsFolder=!!entry("ZebraCalc.exe")&&!!entry("ZebraSticky.exe")
              &&!!entry("ZebraPlanner.exe")&&!!entry("ZebraPaint.exe")
              &&!!entry("Bloc-notes")&&!entry("Réglage de l’ordinateur");
            entry("ZebraCalc.exe").click();
            var calc=document.querySelector(".zu-calc"),key=function(v){return Array.from(calc.querySelectorAll(".zu-calc-key")).find(b=>b.textContent.trim()===v).click();};
            key("2");key("+");key("3");key("=");
            report.calc=document.querySelector(".zu-calc-display").textContent==="5";
            report.calcPersistence=JSON.parse(localStorage.getItem("zebra.tools.v1.calc.visitor")).length===1;
            entry("ZebraSticky.exe").click();
            report.stickyWindow=!!document.querySelector(".zu-sticky-manager-list");
            button("+ NOUVEAU POST-IT",document.querySelector(".zu-app-header")).click();
            var layer=document.querySelector(".zu-sticky-layer");
            report.desktopSticky=!!layer&&layer.querySelectorAll(".zu-sticky-note").length===1;
            var textarea=layer.querySelector("textarea");
            textarea.value="Mémoriser ce refrain";
            textarea.dispatchEvent(new Event("input",{bubbles:true}));
            report.stickyPersistence=JSON.parse(localStorage.getItem("zebra.tools.v1.sticky.visitor"))[0].text==="Mémoriser ce refrain";
            tools.stickyDesktop("zebra");
            report.sessionIsolation=document.querySelectorAll(".zu-sticky-note").length===0;
            tools.stickyDesktop("visitor");
            report.stickyReload=document.querySelector(".zu-sticky-text").value==="Mémoriser ce refrain";
            entry("ZebraPlanner.exe").click();
            var planner=document.querySelector(".zu-planner");
            report.plannerWindow=!!planner&&planner.querySelectorAll(".zu-day").length>=28;
            planner.querySelector(".zu-planner-form input[type=text]").value="Studio";
            planner.querySelector(".zu-planner-form input[type=time]").value="15:30";
            planner.querySelector(".zu-planner-form").requestSubmit();
            report.plannerPersistence=JSON.parse(localStorage.getItem("zebra.tools.v1.planner.visitor"))[0].text==="Studio";
            report.plannerEntry=planner.querySelectorAll(".zu-task").length===1;
            planner.querySelector(".zu-task input[type=checkbox]").click();
            report.plannerCheck=JSON.parse(localStorage.getItem("zebra.tools.v1.planner.visitor"))[0].done===true;
           }catch(e){report.error=String(e.stack||e);}
           document.documentElement.dataset.zebraReport=JSON.stringify(report);
           document.documentElement.dataset.zebraResult=Object.values(report).every(v=>v===true)?"ok":"failed";
          });
          </script>'''
          Path('_verify_zebra_tools.html').write_text(page.replace('</body>',script+'</body>'))
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zebra-tools-server.log 2>&1 &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --touch-events=enabled --window-size=430,900 --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8765/_verify_zebra_tools.html > /tmp/zebra-tools-result.html 2>/tmp/zebra-tools-chrome.log
          grep -o 'data-zebra-phase="[^"]*"' /tmp/zebra-tools-result.html || true
          grep -o 'data-zebra-report="[^"]*"' /tmp/zebra-tools-result.html | tail -c 3500
          grep -o 'data-zebra-result="[^"]*"' /tmp/zebra-tools-result.html
          grep -q 'data-zebra-result="ok"' /tmp/zebra-tools-result.html
