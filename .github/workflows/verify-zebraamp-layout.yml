name: Vérifier ZebraAMP compact sur mobile
on:
  push:
    paths:
      - 'zebraamp.js'
      - 'zebraamp-compact.css'
      - 'index.html'
      - '.github/workflows/verify-zebraamp-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe JavaScript
        run: node --check zebraamp.js
      - name: Tester le lecteur sous Chromium mobile
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          extra=r'''<script>
          window.addEventListener("load",async()=>{
            const report={},sleep=n=>new Promise(r=>setTimeout(r,n));
            try{
              const outer=document.createElement("div");
              outer.className="window focused";
              outer.style.cssText="position:absolute;left:4px;top:3px;width:calc(100vw - 8px);height:calc(100dvh - 45px);";
              const targetWidth=Number(new URLSearchParams(location.search).get("w"))||390;
              outer.style.setProperty("width",targetWidth+"px","important");
              const titlebar=document.createElement("div");
              titlebar.className="titlebar";
              titlebar.textContent="ZebraAMP.exe";
              const host=document.createElement("div");host.className="window-body";
              outer.append(titlebar,host);document.body.append(outer);
              window.ZebraGitFiles={
                subscribe(){},
                load(){return Promise.resolve({ok:true,entries:[]});},
                allFiles(){return []}
              };
              window.ZebraAMPConfig={windowBox(id,title){
                if(id==="amp")return host;
                const visualizerHost=document.createElement("div");
                document.body.append(visualizerHost);
                report.visualizerWindow=id==="visualizer";
                return visualizerHost;
              }};
              window.ZebraAMP.open();
              await sleep(300);
              const root=host.querySelector(".amp3");
              const rect=n=>n.getBoundingClientRect();
              const cover=root.querySelector(".amp3-cover");
              const mini=root.querySelector(".amp3-mini-visual");
              const time=root.querySelector(".amp3-readout");
              const canvas=root.querySelector(".amp3-spectrum");
              const controls=root.querySelector(".amp3-controls");
              const rows=root.querySelector(".amp3-list");
              const bottom=root.querySelector(".amp3-bottom");
              report.rendered=!!root&&!!canvas&&!!rows;
              const info=root.querySelector(".amp3-info-screen");
              const transport=root.querySelector(".amp3-transports");
              const modes=root.querySelector(".amp3-modes");
              report.compact=rect(root.querySelector(".amp3-screen")).height<155
                &&rect(controls).height<52;
              report.separateScreens=mini.contains(canvas)
                &&info.contains(cover)&&info.contains(time)
                &&rect(mini).right<rect(info).left
                &&Math.abs(rect(mini).top-rect(info).top)<3
                &&Math.abs(rect(mini).height-rect(info).height)<3
                &&rect(mini).width>55&&rect(info).width>120;
              report.transportSameLine=Math.abs(rect(transport).top-rect(modes).top)<3
                &&rect(modes).left>rect(transport).right
                &&Math.abs(rect(modes).height-rect(transport).height)<3;
              report.transportLeftAligned=Math.abs(rect(controls).left-rect(transport).left)<10;
              report.visualizerHasScreen=!!mini.querySelector('[data-amp-spectrum-status]')
                &&!!mini.querySelector('.amp3-viz-label')
                &&getComputedStyle(canvas).height!=="0px";
              report.noBigSpectrum=root.querySelectorAll(".amp3-spectrum").length===1
                &&root.querySelector(".amp3-screen").contains(canvas)
                &&!root.textContent.includes("ZEBRA SPECTRE");
              const repeat=root.querySelector("[data-amp-repeat]");
              const vis=root.querySelector(".amp3-visual-btn");
              const shuffle=root.querySelector("[data-amp-shuffle]");
              report.modesTogether=vis.parentElement===repeat.parentElement
                &&shuffle.parentElement===repeat.parentElement
                &&repeat.textContent.trim().length<=4;
              report.repeatCycle=repeat.textContent.includes("∞");
              repeat.click();
              report.repeatCycle=report.repeatCycle&&repeat.textContent.includes("1");
              repeat.click();
              report.repeatCycle=report.repeatCycle&&repeat.textContent.includes("×");
              repeat.click();
              report.repeatCycle=report.repeatCycle&&repeat.textContent.includes("∞");
              report.spectrumNotBlank=canvas.width>0&&canvas.height>0
                &&canvas.getContext("2d").getImageData(5,5,1,1).data[3]>0;
              const group=root.querySelector(".amp3-speed-group");
              const speedButton=group.querySelector("[data-amp-speed]");
              const slider=group.querySelector("[data-amp-speed-input]");
              const panel=group.querySelector(".amp3-speed-panel");
              report.speedClosed=panel.hidden;
              speedButton.click();
              report.speedOpens=!panel.hidden&&speedButton.getAttribute("aria-expanded")==="true";
              const speedBox=rect(panel),extrasBox=rect(root.querySelector(".amp3-extras"));
              report.speedPanelCentered=Math.abs((speedBox.left+speedBox.right)/2-(extrasBox.left+extrasBox.right)/2)<2
                &&speedBox.left>=extrasBox.left&&speedBox.right<=extrasBox.right;
              report.speedHardware=getComputedStyle(panel).backgroundImage.includes("radial-gradient")
                &&getComputedStyle(panel,"::before").backgroundImage.includes("radial-gradient");
              report.speedSteps=slider.min==="50"&&slider.max==="150"&&slider.step==="5";
              slider.value="135";slider.dispatchEvent(new Event("input",{bubbles:true}));
              report.speedApplied=Math.abs(window.ZebraAMP.media.playbackRate-1.35)<.0001
                &&Math.abs(window.ZebraAMP.media.defaultPlaybackRate-1.35)<.0001
                &&speedButton.textContent.includes("135 %")
                &&JSON.parse(localStorage.getItem("zebraamp-v3")).speed===1.35;
              window.ZebraAMP.media.playbackRate=1;
              window.ZebraAMP.media.defaultPlaybackRate=1;
              window.ZebraAMP.media.dispatchEvent(new Event("loadedmetadata"));
              report.speedSurvivesTrackChange=Math.abs(window.ZebraAMP.media.playbackRate-1.35)<.0001
                &&Math.abs(window.ZebraAMP.media.defaultPlaybackRate-1.35)<.0001
                &&window.ZebraAMP.media.preservesPitch===false;
              report.pitchModeDefault=window.ZebraAMP.debug().pitchMode==="vinyl"
                &&window.ZebraAMP.media.preservesPitch===false;
              report.noPitchSelector=group.querySelectorAll("[data-amp-pitch-mode]").length===0
                &&!group.textContent.includes("TONALITÉ STABLE")
                &&!group.textContent.includes("VINYLE · GRAVE");
              report.vinylAlwaysOn=window.ZebraAMP.debug().pitchMode==="vinyl"
                &&window.ZebraAMP.media.preservesPitch===false
                &&JSON.parse(localStorage.getItem("zebraamp-v3")).pitchMode==="vinyl";
              report.noSpeedPresets=!group.querySelector(".amp3-speed-presets")
                &&!group.textContent.includes("SLOWED")
                &&!group.textContent.includes("DEEP");
              group.querySelector(".amp3-speed-reset").click();
              report.speedReset=window.ZebraAMP.media.playbackRate===1;
              speedButton.click();
              report.speedClose=panel.hidden;
              const reverbGroup=root.querySelector(".amp3-reverb-group");
              const reverbButton=reverbGroup.querySelector("[data-amp-reverb]");
              const reverbPanel=reverbGroup.querySelector(".amp3-reverb-panel");
              const reverbInput=reverbGroup.querySelector("[data-amp-reverb-input]");
              report.reverbInitiallyOff=window.ZebraAMP.debug().reverb===0
                &&!window.ZebraAMP.debug().reverbActive;
              report.reverbClosed=reverbPanel.hidden;
              reverbButton.click();
              report.reverbOpens=!reverbPanel.hidden
                &&reverbButton.getAttribute("aria-expanded")==="true";
              report.reverbHardware=getComputedStyle(reverbPanel).backgroundImage.includes("radial-gradient")
                &&getComputedStyle(reverbPanel,"::before").backgroundImage.includes("radial-gradient")
                &&reverbPanel.querySelector(".amp3-reverb-description").textContent==="RÉVERBÉRATION · DURÉE : 3,4 S · BPM AUTO : VEILLE";
              report.reverbSteps=reverbInput.min==="0"&&reverbInput.max==="100"&&reverbInput.step==="5";
              reverbInput.value="65";
              reverbInput.dispatchEvent(new Event("input",{bubbles:true}));
              report.reverbPersisted=window.ZebraAMP.debug().reverb===65
                &&JSON.parse(localStorage.getItem("zebraamp-v3")).reverb===65
                &&reverbButton.textContent.includes("65 %")
                &&reverbPanel.querySelector("[data-amp-reverb-tempo]").textContent.includes("BPM AUTO : ANALYSE");
              report.reverbLazy=!window.ZebraAMP.debug().reverbActive;
              reverbGroup.querySelector(".amp3-reverb-presets button").click();
              report.reverbDryPreset=window.ZebraAMP.debug().reverb===0;
              const presets=reverbGroup.querySelectorAll(".amp3-reverb-presets button");
              presets[2].click();
              report.reverbDreamPreset=window.ZebraAMP.debug().reverb===65;
              reverbButton.click();
              report.reverbClose=reverbPanel.hidden;
              for(let i=0;i<65;i++){
                const row=document.createElement("div");
                row.className="amp3-track";
                row.textContent="Morceau long "+i;
                rows.append(row);
              }
              const bounds=rect(root),foot=rect(bottom),list=rect(rows),outerBound=rect(host);
              report.footerInside=foot.bottom<=bounds.bottom+2
                &&foot.bottom<=outerBound.bottom+2
                &&foot.top>=list.top&&foot.height>20;
              report.onlyListScrolls=rows.scrollHeight>rows.clientHeight+60
                &&root.scrollHeight<=root.clientHeight+3
                &&host.scrollHeight<=host.clientHeight+3;
              rows.scrollTop=150;
              report.playlistScroll=rows.scrollTop>90;
              report.buttonNoWrap=bottom.children.length===2
                &&Math.abs(rect(bottom.children[0]).top-rect(bottom.children[1]).top)<3;
              report.layout={viewport:window.innerWidth,windowH:host.clientHeight,
                pageH:root.clientHeight,pageScrollH:root.scrollHeight,
                listHeight:rows.clientHeight,listScrollH:rows.scrollHeight,
                footerY:Math.round(foot.top),footerBottom:Math.round(foot.bottom),
                hostBottom:Math.round(outerBound.bottom)};
              // Graphe audio créé après ouverture : les fréquences doivent
              // être associées au canvas après le premier ▶, jamais figées à null.
              const originalAudioContext=window.AudioContext;
              class AudioContextFake {
                constructor(){this.state="running";this.destination={};this.sampleRate=44100;this.currentTime=3;}
                createMediaElementSource(){return {connect(){}};}
                createBiquadFilter(){return {frequency:{value:0},gain:{value:0},Q:{value:0},connect(){}};}
                createAnalyser(){return {fftSize:1024,frequencyBinCount:512,
                  smoothingTimeConstant:0,connect(){},disconnect(){},
                  getByteFrequencyData(target){target.fill(0);for(let i=0;i<target.length;i++)target[i]=140;},
                  getByteTimeDomainData(target){target.fill(128);}};}
                createGain(){return {gain:{value:1,setTargetAtTime(value){this.value=value;}},connect(){}};}
                createDelay(){return {delayTime:{value:0},connect(){}};}
                createConvolver(){return {buffer:null,normalize:true,connect(){}};}
                createDynamicsCompressor(){return {
                  threshold:{value:0},knee:{value:0},ratio:{value:0},attack:{value:0},release:{value:0},
                  connect(){}
                };}
                createBuffer(ch,length){
                  const arrays=Array.from({length:ch},()=>new Float32Array(length));
                  return {getChannelData(i){return arrays[i];}};
                }
                resume(){return Promise.resolve();}
              }
              window.AudioContext=AudioContextFake;
              // Déclenche le graphe de l'égaliseur via l'action de lecture.
              const originalPlay=window.ZebraAMP.media.play;
              window.ZebraAMP.media.play=function(){return Promise.resolve();};
              // Sur ce test sans morceau, appeler explicitement Play pour
              // créer le graphe même si aucune piste n'est encore sélectionnée.
              window.ZebraAMP.play();
              report.analyserAfterPlay=!!window.ZebraAMP.analyser()
                &&window.ZebraAMP.analyser().frequencyBinCount===512;
              report.reverbGraphAfterPlay=window.ZebraAMP.debug().reverbActive
                &&window.ZebraAMP.debug().reverbConnected;
              report.reverbStudioTail=window.ZebraAMP.debug().reverbSeconds===3.4;
              // Un curseur à 0 doit stopper l'entrée de la convolution.
              const reverbSlider=root.querySelector("[data-amp-reverb-input]");
              reverbSlider.value="0";reverbSlider.dispatchEvent(new Event("input",{bubbles:true}));
              report.reverbOffAfterUse=window.ZebraAMP.debug().reverb===0
                &&!window.ZebraAMP.debug().reverbConnected
                &&window.ZebraAMP.analyser().frequencyBinCount===512;
              Object.defineProperty(window.ZebraAMP.media,"paused",{
                configurable:true,value:false
              });
              // Comme une lecture audio réelle, l'événement play impose
              // une image immédiate : test déterministe même sans RAF mobile.
              window.ZebraAMP.media.dispatchEvent(new Event("play"));
              const vizStatus=mini.querySelector('[data-amp-spectrum-status]').textContent;
              report.spectrumReconnect=vizStatus==="SIGNAL";
              report.signalDebug={
                targetWidth,visibility:document.visibilityState,
                paused:window.ZebraAMP.media.paused,
                canvasWidth:canvas.width,canvasHeight:canvas.height,
                status:vizStatus
              };
              delete window.ZebraAMP.media.paused;
              window.ZebraAMP.media.play=originalPlay;
              window.AudioContext=originalAudioContext;
              const wasAbsent=!window.ZebraVisualizer;
              vis.click();
              await sleep(400);
              report.visualizerLazy=!!window.ZebraVisualizer&&report.visualizerWindow===true;
            }catch(e){report.error=String(e.stack||e);}
            document.documentElement.dataset.ampReport=JSON.stringify(report);
            document.documentElement.dataset.ampStatus=Object.entries(report).every(([k,v])=>k==="layout"||k==="signalDebug"||v===true)?"ok":"failed";
          });
          </script>'''
          Path('_verify_amp_mobile.html').write_text(html.replace("</body>",extra+"</body>"))
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zebra-amp-server.log 2>&1 &
          sleep 1
          for size in 390,760 340,660; do
            echo "Checking mobile viewport $size..."
            google-chrome --headless=new --no-sandbox --disable-gpu \
              --disable-dev-shm-usage --touch-events=enabled \
              --window-size="$size" --virtual-time-budget=4800 \
              --dump-dom "http://127.0.0.1:8765/_verify_amp_mobile.html?w=$(echo $size | cut -d, -f1)" \
              > /tmp/zebra-amp-test.html 2>/tmp/zebra-amp-chrome.log
            grep -o 'data-amp-report="[^"]*"' /tmp/zebra-amp-test.html | tail -c 3000
            grep -o 'data-amp-status="[^"]*"' /tmp/zebra-amp-test.html
            grep -q 'data-amp-status="ok"' /tmp/zebra-amp-test.html
          done
