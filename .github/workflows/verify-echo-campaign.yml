name: Vérifier Echo Racer campagne quatre niveaux
on:
  push:
    paths:
      - 'echo-racer.js'
      - 'echo-racer.css'
      - 'app.js'
      - 'index.html'
      - '.github/workflows/verify-echo-campaign.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier les scripts et les vraies images
        run: |
          node --check echo-racer.js
          node --check app.js
          for image in 1 2 3 4; do test -s "assets/games/lvl${image}.png"; done
          test -s "assets/games/echo-racer-logo-2026.webp"
          test -s assets/games/echoraccaersong.mp3
          test -s assets/games/echoraccersongpt2.mp3
      - name: Mesurer la durée exacte des deux pistes originales
        run: |
          python3 -m pip install --quiet mutagen
          python3 - <<'PY'
          from mutagen.mp3 import MP3
          for name in ['echoraccaersong.mp3','echoraccersongpt2.mp3']:
              path='assets/games/'+name
              seconds=MP3(path).info.length
              assert seconds>30, f'Unexpectedly short song: {name}'
              print(f'FULL_TRACK_DURATION {name} {seconds:.3f} seconds',flush=True)
          PY
      - name: Installer le navigateur de test
        run: python3 -m pip install --quiet playwright
      - name: Tester les parcours PC et Android simulé
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("app.js").read_text()
          anchor="window.ZebraLazyApps={load:loadGameModule};"
          assert src.count(anchor)==1
          probe='window.__EchoCampaignTest={admin:function(){session="admin";show("desktop-screen");},open:function(){openGame("racer");}};'
          Path("_campaign_app.js").write_text(src.replace(anchor,probe+anchor))
          html=Path("index.html").read_text().replace('app.js?v=','_campaign_app.js?v=')
          Path("_campaign_test.html").write_text(html)
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/echo-campaign-server.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1
          cat >/tmp/echo_campaign_test.py <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          URL="http://127.0.0.1:8765/_campaign_test.html"
          def execute(browser,width,height,mobile):
              ctx=browser.new_context(viewport={"width":width,"height":height},is_mobile=mobile,has_touch=mobile)
              page=ctx.new_page()
              errors=[]
              page.on("pageerror",lambda error:errors.append(str(error)))
              page.goto(URL,wait_until="domcontentloaded")
              page.evaluate('''() => {
                localStorage.setItem('zebra.echo-racer.sfx','off');
                const profiles={p1:{obstaclesEnabled:false},p2:{obstaclesEnabled:false},p3:{obstaclesEnabled:false}};
                localStorage.setItem('zebra.echo-racer.lab.phases.v1',JSON.stringify(profiles));
                localStorage.removeItem('zebra.echo-racer.campaign.unlocked.v1');
                localStorage.removeItem('zebra.echo-racer.campaign.completed.v1');
              }''')
              page.reload(wait_until="domcontentloaded")
              page.wait_for_function("!!window.__EchoCampaignTest")
              page.evaluate("window.__EchoCampaignTest.admin();window.__EchoCampaignTest.open()")
              page.wait_for_function("""!!document.querySelector('.window[data-app-id="racer"] .window-body')?._echoDebug""",timeout=25000)
              page.wait_for_function("""!document.querySelector('.window[data-app-id="racer"]').classList.contains('window-pending')""",timeout=15000)
              game='.window[data-app-id="racer"]'
              menu=page.locator(game+" .er-overlay.er-stage-home")
              assert menu.is_visible(),"Main menu hidden"
              title=menu.locator(".er-home-title")
              assert title.is_visible(), "Text title missing"
              assert title.inner_text().strip()=="ECHO RACER 2", "Wrong arcade title"
              assert float(title.evaluate("(n)=>parseFloat(getComputedStyle(n).letterSpacing)"))>1, "Title needs letter spacing"
              assert menu.locator(".er-brand-logo").count()==0, "Old image logo still present"
              assert menu.locator(".er-overlay-button").inner_text().strip()=="JOUER"
              assert menu.locator(".er-test-button").is_visible()
              assert menu.locator(".er-quit-button").is_visible()
              page.screenshot(path=f"/tmp/campaign-{'mobile' if mobile else 'pc'}-menu.png")
              (page.locator(game+" .window-body").evaluate("(n)=>n._echoDebug.controller(\'pulse\')") if mobile else menu.locator(".er-overlay-button").click())
              levels=page.locator(game+" .er-stage-levels .er-level-button")
              assert levels.count()==4,"There must be four actual cards"
              assert all(levels.nth(i).locator("img").evaluate("(n)=>n.complete&&n.naturalWidth>0") for i in range(4)),"One of four level textures missing"
              assert all(levels.nth(i).evaluate("(n)=>getComputedStyle(n).borderTopWidth")=="0px" for i in range(4)), "Level cards still have a border"
              assert all(levels.nth(i).evaluate("(n)=>getComputedStyle(n).backgroundColor")=="rgba(0, 0, 0, 0)" for i in range(4)), "Level cards still have a background"
              assert all(levels.nth(i).locator(".er-level-name").count()==0 for i in range(4)), "Redundant level subtitles"
              assert not page.locator(game+" .er-stage-levels .er-hint").is_visible(), "Redundant controller instructions"
              locked=[levels.nth(i).get_attribute("aria-disabled") for i in range(4)]
              assert locked==["false","true","true","true"],f"Unexpected locks: {locked}"
              page.screenshot(path=f"/tmp/campaign-{'mobile' if mobile else 'pc'}-levels.png")
              if mobile:
                  page.locator(game+" .window-body").evaluate("(n)=>{n._echoDebug.controller('down');n._echoDebug.controller('pulse');}")
              else:
                  levels.nth(1).evaluate("(b)=>b.click()")
              assert "menu"==page.locator(game+" .window-body").evaluate("(n)=>n._echoDebug.snapshot().mode"),"Locked level started"
              if mobile:
                  page.locator(game+" .window-body").evaluate("(n)=>{n._echoDebug.controller('up');n._echoDebug.controller('pulse');}")
              else:
                  levels.nth(0).click()
              body=page.locator(game+" .window-body")
              assert body.evaluate("(n)=>n._echoDebug.snapshot().mode")=="running","Level one did not launch"
              assert body.evaluate("(n)=>n._echoDebug.level().id")=="run"
              tracks=body.evaluate("(n)=>n._echoDebug.level().available.map(l=>[l.music,l.offset])")
              assert tracks==[["p1",0],["p3",0],["p4",0],["p5",0]], "Level 2 must use existing TEST phase-3 song, not level 1"
              assert body.evaluate("(n)=>n._echoDebug.level().musicRequestedUrl").endswith("echoraccaersong.mp3?v=1")
              assert 216.9<body.evaluate("(n)=>n._echoDebug.level().duration")<217.1, "Level 1 must finish at audible end (~217s) rather than 314s"
              first=body.evaluate("""(n)=>{
                const d=n._echoDebug;
                d.injectPickup('pad',[0,1,2]);
                for(let i=0;i<12&&d.gauges().chain===0;i++)d.advance(.05);
                return d.gauges();
              }""")
              assert first["chain"]==1 and first["padTime"]>0, "First boost not recognized"
              second=body.evaluate("""(n)=>{
                const d=n._echoDebug;
                d.injectPickup('pad',[0,1,2]);
                for(let i=0;i<12&&d.gauges().chain<2;i++)d.advance(.05);
                return d.gauges();
              }""")
              assert second["chain"]==2, "Second uninterrupted pad did not chain"
              assert second["speedMultiplier"]>first["speedMultiplier"], "Chained pads must increase speed gradually"
              assert 1.30<first["speedMultiplier"]<=1.35, "First boost should be more powerful but controlled"
              assert second["speedMultiplier"]<=1.64, "Uncontrolled chained boost multiplier"
              body.evaluate("(n)=>n._echoDebug.draw()")
              page.screenshot(path=f"/tmp/campaign-{'mobile' if mobile else 'pc'}-stage1.png")
              # In the dedicated test environment only, hazards were disabled
              # through saved editor parameters to validate timed completion without collisions.
              body.evaluate("""(n)=>{
                for(let i=0;i<7000&&n._echoDebug.snapshot().mode==='running';i++)
                  n._echoDebug.advance(.05);
                n._echoDebug.tickFinale(4);
              }""")
              state=body.evaluate("(n)=>({snap:n._echoDebug.snapshot(),level:n._echoDebug.level()})")
              assert state["snap"]["mode"]=="finished",f"Level did not finish: {state['snap']['mode']}"
              assert state["level"]["unlockedLevel"]==2 and state["level"]["completedLevels"]==1
              if mobile:
                  page.locator(game+" .window-body").evaluate("(n)=>{n._echoDebug.controller('down');n._echoDebug.controller('pulse');}")
              else:
                  page.locator(game+" .er-finale-actions button").last.click()
              levels=page.locator(game+" .er-stage-levels .er-level-button")
              assert levels.nth(1).get_attribute("aria-disabled")=="false","Level 2 still locked"
              assert levels.nth(2).get_attribute("aria-disabled")=="true","Level 3 unlocked too early"
              if mobile:
                  page.locator(game+" .window-body").evaluate("(n)=>{n._echoDebug.controller('down');n._echoDebug.controller('pulse');}")
              else:
                  levels.nth(1).click()
              state=body.evaluate("(n)=>({level:n._echoDebug.level(),snap:n._echoDebug.snapshot()})")
              assert state["level"]["id"]=="l2", "Level 2 did not launch"
              assert state["level"]["musicRequestedUrl"].endswith("echoraccersongpt2.mp3?v=1"), "Level 2 must play the available TEST phase-3 track"
              assert abs(state["level"]["duration"]-192.287)<1, "Level 2 should play the whole phase-3 track"
              assert state["snap"]["lab"]["colorMain"]=="#24f0da","Level 2 palette missing"
              assert state["snap"]["lab"]["colorHazard"]=="#145e87","Level 2 obstacles must inherit TEST phase-3 color"
              assert state["level"]["available"][1]["motion"]==1
              body.evaluate("(n)=>n._echoDebug.draw()")
              page.screenshot(path=f"/tmp/campaign-{'mobile' if mobile else 'pc'}-stage2.png")
              for finished_index in (2,3,4):
                  body.evaluate("""(n)=>{
                    for(let i=0;i<7000&&n._echoDebug.snapshot().mode==='running';i++)
                      n._echoDebug.advance(.05);
                    n._echoDebug.tickFinale(4);
                  }""")
                  stage=body.evaluate("(n)=>({snap:n._echoDebug.snapshot(),level:n._echoDebug.level()})")
                  assert stage["snap"]["mode"]=="finished",f"Stage {finished_index} did not finish"
                  assert stage["level"]["completedLevels"]==finished_index
                  assert stage["level"]["unlockedLevel"]==min(4,finished_index+1)
                  if finished_index<4:
                      if mobile:
                          body.evaluate("(n)=>{n._echoDebug.controller('down');n._echoDebug.controller('pulse');}")
                      else:
                          page.locator(game+" .er-finale-actions button").last.click()
                      next_index=finished_index
                      cards=page.locator(game+" .er-stage-levels .er-level-button")
                      assert cards.nth(next_index).get_attribute("aria-disabled")=="false",f"Next stage {next_index+1} locked"
                      if next_index+1<4:
                          assert cards.nth(next_index+1).get_attribute("aria-disabled")=="true","Stage unlocked too early"
                      if mobile:
                          for _ in range(next_index):
                              body.evaluate("(n)=>n._echoDebug.controller('down')")
                          body.evaluate("(n)=>n._echoDebug.controller('pulse')")
                      else:
                          cards.nth(next_index).click()
                      selected=body.evaluate("(n)=>({level:n._echoDebug.level(),snap:n._echoDebug.snapshot()})")
                      assert selected["level"]["id"]==["run","l2","l3","l4"][next_index]
                      assert selected["level"]["available"][next_index]["motion"]==next_index
                      durations=[217,192.287,120.529,142.812]
                      assert abs(selected["level"]["duration"]-durations[next_index])<1.0,"Wrong course soundtrack length"
                      if next_index==2:
                          assert "echo-racer-minimal.mp3" in selected["level"]["musicRequestedUrl"]
                      if next_index==3:
                          assert "echo-racer-dep-house.mp3" in selected["level"]["musicRequestedUrl"]
                      assert selected["snap"]["lab"]["colorMain"]==["#ff3ed1","#24f0da","#86a1ff","#ffc46c"][next_index]
                      body.evaluate("(n)=>n._echoDebug.draw()")
                      page.screenshot(path=f"/tmp/campaign-{'mobile' if mobile else 'pc'}-stage{next_index+1}.png")
              all_four_done=body.evaluate("(n)=>n._echoDebug.level().completedLevels")==4
              assert all_four_done,"Four-level progression incomplete"
              page.locator(game+" [data-close]").click()
              page.evaluate("window.__EchoCampaignTest.open()")
              page.wait_for_function("""!!document.querySelector('.window[data-app-id="racer"] .window-body')?._echoDebug""",timeout=20000)
              saved=page.locator(game+" .window-body").evaluate("(n)=>n._echoDebug.level().unlockedLevel")
              assert saved==4,"All four completed stages not persisted in localStorage"
              assert not errors, "Uncaught JS errors: "+repr(errors)
              result={"viewport":f"{width}x{height}","textTitle":True,"fourCards":True,"unchainedBoostSpeed":first["speedMultiplier"],"chainedBoostSpeed":second["speedMultiplier"],"level1Finished":True,"unlocked2":True,"locked3":True,"movement2":True,"allFourFinished":all_four_done,"saved":True,"pageErrors":errors}
              print("CAMPAIGN_TEST "+json.dumps(result,ensure_ascii=False),flush=True)
              ctx.close()
          with sync_playwright() as p:
              browser=p.chromium.launch(channel="chrome",headless=True,args=["--no-sandbox","--disable-dev-shm-usage"])
              execute(browser,1366,900,False)
              execute(browser,390,844,True)
              browser.close()
          PY
          python3 /tmp/echo_campaign_test.py
      - name: Captures PC/mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-campaign-screens
          path: /tmp/campaign-*.png
          if-no-files-found: ignore
          retention-days: 7
