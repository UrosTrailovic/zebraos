name: Tester les commandes Tetris
on:
  push:
    paths:
      - '.github/workflows/verify-tetris-controls.yml'
      - 'tetris.js'
      - 'tetris-artwork.js'
      - 'style.css'
      - 'app.js'
      - 'assets/games/zebra-tetris-ui.png'
      - 'assets/games/tetris-controls/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigateur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tester la manette et les interactions dans Chromium
        run: |
          # Toutes les fenêtres partagent windowBox(): la barre décorative a disparu.
          ! grep -q 'class=\\"window-status\\"' app.js
          grep -q 'window > .window-status{display:none!important}' style.css
          cat > _verify_tetris_controls.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <link rel="stylesheet" href="/style.css">
          </head><body>
          <div class="window focused" style="width:420px;height:820px;position:relative">
            <div id="test-root" class="window-body zebra-game-body" style="height:100%;width:100%;"></div>
          </div>
          <script src="/tetris-artwork.js"></script>
          <script src="/tetris.js"></script>
          <script>
          const root=document.getElementById("test-root"),report={};
          const finish=()=>{
            const passed=Object.values(report).every(x=>x===true);
            document.body.dataset.result=passed?"ok":"failed";
            document.body.dataset.report=JSON.stringify(report);
          };
          function pointer(button){
            button.dispatchEvent(new PointerEvent("pointerdown",{bubbles:true,cancelable:true,button:0,pointerId:55,pointerType:"touch"}));
            button.dispatchEvent(new PointerEvent("pointerup",{bubbles:true,cancelable:true,button:0,pointerId:55,pointerType:"touch"}));
          }
          window.addEventListener("load",()=>{
            try{
              window.ZebraTetris.mount(root);
              const $=selector=>root.querySelector(selector);
              report.mount=!!$(".zt-dpad")&&!!$(".zt-a")&&!!$(".zt-b")&&!!$(".zt-select");
              report.assets=!!$(".zt-logo");
              report.buttons=!!$(".zt-play")&&!!$(".zt-restart")&&!!$(".zt-menu");
              $(".zt-play").click();
              report.start=$(".zg-state").textContent==="EN COURS";
              pointer($(".zt-dir-left"));
              pointer($(".zt-dir-up"));
              pointer($(".zt-dir-down"));
              pointer($(".zt-a"));
              pointer($(".zt-b"));
              report.hardDrop=Number($(".zg-stat strong").textContent)>0;
              pointer($(".zt-select"));
              report.hold=root.querySelectorAll(".zg-mini").length===2;
              $(".zt-play").click();
              report.pause=$(".zg-state").textContent==="PAUSE";
              $(".zt-play").click();
              report.resume=$(".zg-state").textContent==="EN COURS";
              $(".zt-restart").click();
              report.restart=$(".zg-state").textContent==="EN COURS"&&Number($(".zg-stat strong").textContent)===0;
              $(".zt-menu").click();
              report.menu=$(".zg-state").textContent==="MENU";
              $(".zt-play").click();
              report.exitMenu=$(".zg-state").textContent==="EN COURS";
              setTimeout(()=>{
                report.loadedTextures=$(".zt-logo").naturalWidth>0&&root.querySelector(".zt-art-loaded")!==null;
                const skin=$(".zt-handheld");
                const sprites=Array.from(root.querySelectorAll(".zt-control-sprite"));
                report.customPanel=skin.classList.contains("zt-skin-ready");
                report.expandedControls=skin.getBoundingClientRect().height>=188;
                report.sevenControls=sprites.length===7&&sprites.every(i=>i.complete&&i.naturalWidth>0);
                if(report.customPanel){
                  const panel=skin.getBoundingClientRect();
                  const bar=skin.querySelector(".zt-buttons").getBoundingClientRect();
                  const panelTop=panel.top+parseFloat(getComputedStyle(skin,"::before").top||"0");
                  const inPanel=el=>{
                    const rect=el.getBoundingClientRect();
                    return rect.top>=panelTop-3&&rect.bottom<=panel.bottom+3
                      &&rect.left>=panel.left-3&&rect.right<=panel.right+3;
                  };
                  report.toolbarAboveArt=bar.top<panelTop&&bar.bottom<=panelTop+3;
                  report.dpadInsideArt=["up","down","left","right"].every(dir=>inPanel($(".zt-dir-"+dir)));
                  report.actionsInsideArt=[".zt-a",".zt-b",".zt-select"].every(sel=>inPanel($(sel)));
                  const up=$(".zt-dir-up").getBoundingClientRect(),down=$(".zt-dir-down").getBoundingClientRect();
                  const left=$(".zt-dir-left").getBoundingClientRect(),right=$(".zt-dir-right").getBoundingClientRect();
                  report.dpadAligned=Math.abs((up.left+up.right)/2-(down.left+down.right)/2)<3
                    &&Math.abs((left.top+left.bottom)/2-(right.top+right.bottom)/2)<3;
                  console.log("ZEBRA_LAYOUT",JSON.stringify({
                    panelTop:Math.round(panelTop-panel.top),
                    toolbarBottom:Math.round(bar.bottom-panel.top),
                    up:Math.round(up.top-panel.top),downBottom:Math.round(down.bottom-panel.top),
                    selectBottom:Math.round($(".zt-select").getBoundingClientRect().bottom-panel.top)
                  }));
                }else{
                  report.toolbarAboveArt=false;
                  report.dpadInsideArt=false;
                  report.actionsInsideArt=false;
                  report.dpadAligned=false;
                }
                report.controlsStillMapped=!!$(".zt-dir-up")&&!!$(".zt-dir-down")
                  &&!!$(".zt-dir-left")&&!!$(".zt-dir-right")&&!!$(".zt-a")&&!!$(".zt-b")&&!!$(".zt-select");
                if(report.customPanel){
                  const btnBox=skin.querySelector(".zt-dir-left").getBoundingClientRect();
                  report.touchTarget=btnBox.width>=30&&btnBox.height>=30;
                }else report.touchTarget=false;
                const main=$(".zg-game-layout").getBoundingClientRect();
                const board=$(".zg-tetris-stage").getBoundingClientRect();
                const hud=$(".zg-side").getBoundingClientRect();
                const logo=$(".zt-logo").getBoundingClientRect();
                report.boardCentered=Math.abs((board.left+board.right)/2-(main.left+main.right)/2)<3;
                report.scoreLeft=hud.right<=board.left-2&&hud.left>=main.left-2;
                const previews=$(".zg-side-previews").getBoundingClientRect();
                report.previewRight=previews.left>=board.right+2&&previews.right<=main.right+2;
                report.panelsSeparated=$(".zg-side-stats").querySelectorAll(".zg-stat").length===4
                  &&$(".zg-side-stats").querySelectorAll(".zg-preview-wrap").length===0
                  &&$(".zg-side-previews").querySelectorAll(".zg-preview-wrap").length===2
                  &&$(".zg-side-previews").querySelectorAll(".zg-stat").length===0;
                report.boardFits=board.height>350&&board.bottom<=main.bottom+2;
                report.logoReadable=logo.height>=58&&logo.width>=170;
                root._zebraDispose();
                finish();
              },1600);
            }catch(e){report.error=String(e);finish();}
          });
          setTimeout(()=>{if(!document.body.dataset.result){report.timeout=false;finish();}},3800);
          </script></body></html>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zebra-tetris-test-server.log 2>&1 &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --touch-events=enabled --window-size=430,900 --virtual-time-budget=4800 --dump-dom http://127.0.0.1:8765/_verify_tetris_controls.html > /tmp/zebra-tetris-test.html 2>/tmp/zebra-tetris-chrome.log
          grep -o 'data-report="[^"]*"' /tmp/zebra-tetris-test.html
          grep -o 'data-result="[^"]*"' /tmp/zebra-tetris-test.html
          grep -q 'data-result="ok"' /tmp/zebra-tetris-test.html
