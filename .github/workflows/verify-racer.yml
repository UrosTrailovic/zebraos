name: Vérifier Zebra Pursuit
on:
  push:
    paths:
      - racer.js
      - racer.css
      - tests/racer.test.cjs
      - .github/workflows/verify-racer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check racer.js && node --test tests/racer.test.cjs
      - name: Vérifier le rendu, les commandes et le mobile
        run: |
          cat > _verify_racer.html <<'HTML'
          <!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="racer.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}#game{position:fixed;inset:0}</style><div id="game"></div><script src="racer.js"></script><script>
          addEventListener('load',async()=>{
           const out={},root=document.querySelector('#game'),wait=ms=>new Promise(r=>setTimeout(r,ms));
           try{
            ZebraRacer.mount(root);await wait(100);const wrap=root.querySelector('.zr-game'),canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d'),screen=root.querySelector('.zr-screen').getBoundingClientRect();
            out.api=typeof ZebraRacer.createGame==='function'&&typeof root._zebraDispose==='function';
            out.title=wrap.dataset.state==='title'&&root.querySelector('.zr-start').textContent==='START';
            out.canvas=canvas.width===960&&canvas.height===540&&ctx.getImageData(720,116,1,1).data[3]===255;
            out.fit=screen.width>200&&screen.left>=0&&screen.right<=innerWidth+1&&screen.bottom<=innerHeight+1&&Math.abs(screen.width/screen.height-16/9)<.03;
            out.controls=Array.from(root.querySelectorAll('[data-control]')).map(b=>b.dataset.control).join('|')==='left|right|brake|nitro|gas';
            document.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true}));await wait(650);document.dispatchEvent(new KeyboardEvent('keyup',{key:'ArrowUp',bubbles:true}));
            out.drives=wrap.dataset.state==='running'&&Number(wrap.dataset.speed)>20;
            document.dispatchEvent(new KeyboardEvent('keydown',{key:'p',bubbles:true}));await wait(40);out.pause=wrap.dataset.state==='paused'&&!root.querySelector('.zr-start').hidden;
            root.querySelector('.zr-start').click();await wait(40);out.resume=wrap.dataset.state==='running';
            if(innerWidth<=700)out.touchTargets=Array.from(root.querySelectorAll('.zr-controls button')).every(b=>{const r=b.getBoundingClientRect();return r.width>=50&&r.height>=48&&r.left>=0&&r.right<=innerWidth+1;});
            root._zebraDispose();const speed=wrap.dataset.speed;await wait(100);out.dispose=wrap.dataset.speed===speed;
           }catch(e){out.error=String(e.stack||e)}
           document.documentElement.dataset.racerReport=JSON.stringify(out);document.documentElement.dataset.racerStatus=Object.values(out).every(v=>v===true)?'ok':'failed';
          });
          </script>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/racer-server.log 2>&1 &
          sleep 1
          for size in 390,780 1100,800; do
            google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --touch-events=enabled --window-size=$size --virtual-time-budget=2400 --dump-dom http://127.0.0.1:8765/_verify_racer.html > /tmp/racer-$size.html 2>/tmp/racer-$size.log
            report=$(grep -o 'data-racer-report="[^"]*"' /tmp/racer-$size.html || true)
            echo "$report"
            if ! grep -q 'data-racer-status="ok"' /tmp/racer-$size.html; then
              echo "::error title=Zebra Pursuit $size::$report"
              exit 1
            fi
          done
