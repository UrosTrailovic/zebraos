<script>
/* ZebraOS project-site HTTPS fallback. This runs ONLY on GitHub's own domain;
   it does not alter the regular custom-domain experience or stored user data. */
(function(){
 if(location.hostname!=="urostrailovic.github.io"||!/^\/zebraos(?:\/|$)/.test(location.pathname))return;
 var base=document.createElement("base");base.href="/zebraos/";document.head.appendChild(base);
 function fix(u){return typeof u==="string"&&u[0]==="/"&&u[1]!=="/"&&!u.startsWith("/zebraos/")?"/zebraos"+u:u;}
 var originalFetch=window.fetch;
 if(originalFetch)window.fetch=function(input,init){
  if(typeof input==="string")input=fix(input);
  else if(input instanceof Request&&input.url.startsWith(location.origin+"/")&&!input.url.startsWith(location.origin+"/zebraos/"))
   input=new Request(location.origin+fix(input.url.slice(location.origin.length)),input);
  return originalFetch.call(this,input,init);
 };
 var origSet=Element.prototype.setAttribute;
 Element.prototype.setAttribute=function(name,value){
  if(/^(src|href|poster)$/i.test(name))value=fix(value);
  return origSet.call(this,name,value);
 };
 function patchSource(proto,prop){
  if(!proto)return;
  var descriptor=Object.getOwnPropertyDescriptor(proto,prop);
  if(descriptor&&descriptor.set&&descriptor.get&&descriptor.configurable)
   Object.defineProperty(proto,prop,{configurable:true,enumerable:descriptor.enumerable,
    get:descriptor.get,set:function(v){return descriptor.set.call(this,fix(v));}});
 }
 [[HTMLImageElement,"src"],[HTMLScriptElement,"src"],[HTMLLinkElement,"href"],
  [HTMLMediaElement,"src"],[HTMLSourceElement,"src"]].forEach(function(entry){patchSource(entry[0]&&entry[0].prototype,entry[1]);});
 if(window.Audio){var OriginalAudio=window.Audio;window.Audio=function(src){return new OriginalAudio(fix(src));};window.Audio.prototype=OriginalAudio.prototype;}
 var originalOpen=XMLHttpRequest.prototype.open;
 XMLHttpRequest.prototype.open=function(method,url){arguments[1]=fix(url);return originalOpen.apply(this,arguments);};
 function patchElement(el){
  if(!el||el.nodeType!==1)return;
  for(var i=0;i<3;i++){
   var attr=["src","href","poster"][i],value=el.getAttribute(attr);
   if(value&&fix(value)!==value)origSet.call(el,attr,fix(value));
  }
  if(el.hasAttribute("style")){
   var style=el.getAttribute("style");
   var changed=style.replace(/url\(\s*(['"]?)\/(?!\/|zebraos\/)/gi,"url($1/zebraos/");
   if(style!==changed)origSet.call(el,"style",changed);
  }
 }
 new MutationObserver(function(changes){
  for(var i=0;i<changes.length;i++){
   var m=changes[i];if(m.type==="attributes")patchElement(m.target);
   else for(var j=0;j<m.addedNodes.length;j++){
    var node=m.addedNodes[j];patchElement(node);
    if(node.querySelectorAll)node.querySelectorAll("[src],[href],[poster],[style]").forEach(patchElement);
   }
  }
 }).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:["src","href","poster","style"]});
 document.addEventListener("DOMContentLoaded",function(){
  document.querySelectorAll('link[rel="stylesheet"]').forEach(function(link){
   var href=link.href;
   originalFetch.call(window,href).then(function(r){return r.ok?r.text():null;}).then(function(css){
    if(!css)return;
    var fixed=css.replace(/url\(\s*(['"]?)\/(?!\/|zebraos\/)/gi,"url($1/zebraos/");
    if(fixed===css)return;
    var style=document.createElement("style");style.textContent=fixed;link.after(style);link.disabled=true;
   }).catch(function(){});
  });
 });
})();
</script>
<script>
/* DEV MODE ZebraOS : aucun Service Worker pendant le développement.
   Nettoie les anciens caches avant que les ressources de l'app soient utilisées. */
(function(){
 if(!("serviceWorker" in navigator))return;
 var hadController=!!navigator.serviceWorker.controller;
 Promise.all([
  navigator.serviceWorker.getRegistrations().then(function(regs){
   return Promise.all(regs.map(function(reg){return reg.unregister();}));
  }).catch(function(){return [];}),
  ("caches" in window)?caches.keys().then(function(keys){
   return Promise.all(keys.filter(function(k){return k.indexOf("zebraos-code-")===0;})
    .map(function(k){return caches.delete(k);}));
  }).catch(function(){return []}):Promise.resolve([])
 ]).then(function(){
  if(hadController && sessionStorage.getItem("zebraos-dev-sw-cleaned")!=="1"){
   sessionStorage.setItem("zebraos-dev-sw-cleaned","1");
   location.reload();
  }else{
   sessionStorage.removeItem("zebraos-dev-sw-cleaned");
  }
 });
})();
</script>

<div id="power-screen" class="screen active zp3-ready" aria-label="Machine ZebraOS — allumage">
  <div class="zp3-machine" role="group" aria-label="Façade métallique de ZebraOS">
    <img class="zp3-face" src="assets/powerv3/pcinterface.webp" alt="" aria-hidden="true" fetchpriority="high" decoding="async">
    <img class="zp3-led zp3-led-power" src="assets/powerv3/pcoff.webp" alt="" aria-hidden="true">
    <img class="zp3-led zp3-led-net" src="assets/powerv3/pcoff.webp" alt="" aria-hidden="true">
    <img class="zp3-sticker-z" src="assets/powerv3/zebraossticker.webp" alt="" aria-hidden="true">
    <img class="zp3-sticker-i" src="assets/powerv3/intel%20sticker.webp" alt="" aria-hidden="true">
    <button id="power-btn" class="zp3-btn" type="button" aria-label="Allumer ZebraOS">
      <img src="assets/powerv3/btnpcoff.webp" alt="" aria-hidden="true">
    </button>
  </div>
</div>
<div id="boot-screen" class="screen" aria-label="Démarrage de ZebraOS">
  <div class="zboot-logo-frame"><img class="zboot-logo"  alt="ZebraOS" /></div>
  <button id="skip-boot" class="zboot-skip" aria-label="Passer l'animation de démarrage">PASSER L’INTRO &gt;</button>
</div>
<div id="session-boot-screen" class="screen" aria-label="Ouverture de session">
  <div class="zboot-session-content">
    <img class="zboot-session-logo"  alt="ZebraOS" />
    <span id="zboot-session-label">OUVERTURE DE SESSION</span>
  </div>
  <button id="skip-session-boot" class="zboot-skip" aria-label="Passer l'ouverture de session" >PASSER &gt;</button>
</div>
<div id="login-screen" class="screen">
  <div class="login-top-band" aria-hidden="true"></div>
  <main class="login-content">
    <div class="login-header">
      <img class="login-brand-logo" src="/assets/boot/logo.png" alt="ZebraOS">
    </div>
    <p class="login-prompt">Pour commencer, cliquez sur votre nom d’utilisateur.</p>
    <div id="login-users" class="login-users" aria-label="Choix de la session"></div>
  </main>
  <div class="login-footer">
    <div class="login-power-actions">
      <button id="restart-login" class="login-power-button" type="button"><svg class="login-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 11a8.5 8.5 0 1 1 2.5 6.1M3.5 4.5V11H10" /></svg><span>Redémarrer</span></button>
      <button id="shutdown-login" class="login-power-button" type="button"><svg class="login-action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5V12M6.2 5.8a9 9 0 1 0 11.6 0" /></svg><span>Éteindre l’ordinateur</span></button>
    </div>
  </div>
</div>
<div id="desktop-screen" class="screen">
  <div id="wallpaper" class="wallpaper wallpaper-visitor"><div class="wallpaper-grain"></div><div class="wallpaper-label" hidden><span></span></div></div>
  <div id="desktop-icons" class="desktop-icons"></div>
  <div id="windows-area"></div>
  <div id="start-menu" class="start-menu hidden"><div class="start-side">ZebraOS <b>2.0</b></div><div class="start-options"><button data-start="amp">▣ <span>ZebraAMP</span></button><button data-start="explorer">▤ <span>Poste de travail</span></button><hr><button data-start="folder:games">▦ <span>Jeux</span></button><button data-start="folder:tools">▤ <span>Outils</span></button><hr><button data-start="settings">⚙ <span>Réglage de l’ordinateur</span></button><button data-start="about">ⓘ <span>Propriétés du système</span></button><hr><button id="logout">⇥ <span>Fermer la session</span></button><button id="shutdown-desktop">⏻ <span>Éteindre</span></button></div></div>
  <div class="taskbar"><button id="start-button" class="win-button start-button"><span class="start-z">Z</span> Démarrer</button><div id="task-items"></div><div class="tray"><span class="tray-icon" title="Réseau du studio ZebraOS">◉</span><span id="clock"></span></div></div>
</div>
