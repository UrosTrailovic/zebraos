name: Contrôler le Bienvenue publié
on:
  push:
    branches: [main]
    paths:
      - 'tests/manual-production.py'
      - '.github/workflows/verify-manual-production.yml'
  workflow_run:
    workflows:
      - pages build and deployment
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Installer le navigateur de contrôle
        run: python3 -m pip install --quiet playwright
      - name: Vérifier les captures et les manuels sur le domaine
        run: python3 tests/manual-production.py
      - name: Captures de l'accueil public
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bienvenue-public-pc-mobile
          path: manual-production-screenshots/
          if-no-files-found: ignore
