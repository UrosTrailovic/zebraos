name: Vérifier les nouveaux dangers Echo Racer
on:
  push:
    paths:
      - 'echo-racer.js'
      - 'app.js'
      - '.github/workflows/verify-echo-hazards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hazards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe et la progression des menaces
        run: |
          node --check echo-racer.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('echo-racer.js','utf8'),context,{timeout:2500});
          const api=context.window.ZebraEchoRacer;
          const families={run:['laser'],l2:['laser'],l3:['laser'],l4:['drone','laser'],free:[]};
          for(const [id,expected] of Object.entries(families)){
           const actual=new Set();
           for(let gate=1;gate<=175;gate++){
            const t=api.hazardTypeForLevel(id,gate);
            if(gate<5)assert.equal(t,null);
            if(t)actual.add(t);
           }
           assert.deepEqual([...actual].sort(),expected.sort(),id);
           if(id==='free')continue;
           for(let gate=7;gate<50;gate++){
            const p=api.laserBlueprint(id,gate);
            assert.ok(p.count>=1&&p.count<=3);
            if(id!=='run')assert.ok(p.count>=2,'later levels require crossed rays');
            assert.equal(p.rotating,id==='l3'||id==='l4');
           }
          }
          // A partial beam only touches its originating rim, not the opposite wall.
          const partial={rotation:0,rays:[{a:0,reach:.55}]};
          assert.equal(api.laserContact(0,partial),true);
          assert.equal(api.laserContact(Math.PI,partial),false);
          const triple={rotation:0,rays:[{a:0,reach:1},{a:Math.PI/3,reach:1},{a:2*Math.PI/3,reach:1}]};
          assert.equal(api.laserContact(Math.PI/6,triple),false);
          // Reproducible randomized encounters, varied across seeds and restarts.
          const seeds=[1,7,125,0x1234abcd];
          for(const id of ['run','l2','l3','l4','free']){
           let foundLaserStreak=false,foundDrone=false,foundLongWalls=false;
           let sampleFirst=null;
           for(const seed of seeds){
            const seq=api.makeHazardSchedule(id,240,seed);
            const seqLong=api.makeHazardSchedule(id,320,seed);
            assert.equal(seq.length,240);
            assert.deepEqual([...seq.slice(0,240)],[...seqLong.slice(0,240)]);
            assert.deepEqual([...seq.slice(0,4)],[null,null,null,null]);
            if(seed===seeds[0])sampleFirst=[...seq];
            else if(id!=='free'&&seed===seeds[1])
             assert.notDeepEqual([...seq.slice(0,120)],sampleFirst.slice(0,120),'sequence never changes');
            let laserRun=0,wallRun=0;
            for(let i=0;i<seq.length;i++){
             const type=seq[i];
             assert.ok([null,'laser','drone'].includes(type),'unexpected obstacle family');
             if(type==='laser'){laserRun++;wallRun=0;}
             else {laserRun=0;wallRun=type===null?wallRun+1:0;}
             if(laserRun>=2)foundLaserStreak=true;
             if(wallRun>=4)foundLongWalls=true;
             if(laserRun>3)assert.fail('laser chain too long');
             if(type==='drone'){
              foundDrone=true;
              for(let offset of [-2,-1,1,2]){
               if(i+offset>=0&&i+offset<seq.length)
                assert.notEqual(seq[i+offset],'laser','drone spawned inside laser chain');
              }
             }
             assert.equal(api.hazardTypeForLevel(id,i+1,seed),type);
            }
           }
           if(id==='free')assert.ok(!foundLaserStreak&&!foundDrone);
           else assert.ok(foundLongWalls,'missing wall rhythm: '+id);
           if(id==='l2'||id==='l3'||id==='l4')
            assert.ok(foundLaserStreak,'missing multi-laser cinematic sequences: '+id);
           if(id==='l4')assert.ok(foundDrone,'missing drones');
           if(id!=='l4')assert.ok(!foundDrone,'drones before finale');
          }
          console.log('ENCOUNTER_RHYTHM_OK: 5 modes, 4 seeds, short laser chains, separated drones');
          console.log('HAZARD_PROGRESSION_OK: no electricity, laser shapes and safe sectors');
          NODE
      - name: Installer Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Tester collisions, esquives et mouvement PC/mobile
        run: |
          cat > _verify_echo_hazards.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="/style.css">
          <link rel="stylesheet" href="/echo-racer.css">
          <style>body{margin:0;background:#222}.window{position:relative;height:870px;width:100%}
          .window-body{height:100%;width:100%;padding:0}</style></head>
          <body><div class="window focused"><div id="game" class="window-body zebra-game-body"></div></div>
          <script src="/echo-racer.js"></script>
          <script>window.addEventListener('load',()=>window.ZebraEchoRacer.mount(document.querySelector('#game')));</script>
          </body></html>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/echo-lasers-http.log 2>&1 &
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for width,height in [(1280,900),(390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height})
                  errors=[]
                  page.on('pageerror',lambda e: errors.append(str(e)))
                  page.add_init_script("localStorage.setItem('zebra.echo-racer.campaign.unlocked.v1','4')")
                  page.goto('http://127.0.0.1:8765/_verify_echo_hazards.html',wait_until='load')
                  page.wait_for_function("!!document.querySelector('#game')._echoDebug")
                  result=page.evaluate("""() => {
                   const d=document.querySelector('#game')._echoDebug,PI=Math.PI;
                   const advance=(n)=>{for(let i=0;i<n;i++)d.advance(.05);};
                   const start=()=>{d.testPhase('p1');d.setTestInvincible(false);};
                   function laserCase(rayList,shipAngle){
                    start();
                    const h=d.injectHazard('laser',d.hitDepth+.44);
                    h.rays=rayList;h.rotation=0;h.spin=0;
                    d.setShipAngle(shipAngle);
                    advance(16);d.draw();
                    return d.snapshot().lives;
                   }
                   const star=[{a:0,reach:1},{a:PI/3,reach:1},{a:2*PI/3,reach:1}];
                   const starHit=laserCase(star,0),starDodge=laserCase(star,PI/6);
                   const shortHit=laserCase([{a:0,reach:.57}],0);
                   const shortDodge=laserCase([{a:0,reach:.57}],PI);
                   // Level 3 introduces actual rotation of the full laser hitbox.
                   d.menu();
                   const selectedL3=d.selectLevel('l3');start();
                   const spinning=d.injectHazard('laser',d.hitDepth+13);
                   const firstAngle=spinning.rotation,spin=spinning.spin;
                   advance(18);d.draw();
                   const lastAngle=spinning.rotation,rotated=Math.abs(lastAngle-firstAngle)>.15;
                   // A drone patrols, then tracks the ship and drops two
                   // independent mines. Its angular position must actually change.
                   start();const mover=d.injectHazard('drone',d.hitDepth+22);
                   const from=mover.bodyAngle;
                   d.setShipAngle(PI);advance(34);d.draw();
                   const moved=Math.abs(((mover.bodyAngle-from+PI*3)%(PI*2))-PI)>.14;
                   const dropped=mover.drops>=1;
                   const mine=mover.mines[0],mineBefore=mine&&mine.z;
                   advance(2);
                   const mineMoved=!!mine&&mine.z<mineBefore;
                   function droneCase(hit){
                    start();
                    const h=d.injectHazard('drone',d.hitDepth+4.5);
                    h.bodyAngle=0;h.trackAngle=0;h.patrolPhase=0;
                    d.setShipAngle(0);d.advance(.05);
                    if(!hit)d.setShipAngle(PI);
                    advance(55);d.draw();
                    return d.snapshot().lives;
                   }
                   const mineHit=droneCase(true),mineDodge=droneCase(false);
                   start();
                   const target=d.injectHazard('drone',d.hitDepth+5);
                   d.advance(.05);const countBefore=target.mines.length;
                   d.pulse();const pulseKill=target.cleared&&target.mines.length===0;
                   advance(35);d.draw();
                   const pulseSafe=d.snapshot().lives===3;
                   const noElectric=d.injectHazard('electric')===null;
                   d.menu();
                   const selectedFinal=d.selectLevel('l4');
                   d.start(false);
                   const finalPalette=d.palette();
                   const finalPlan=d.encounterPlan();
                   const finalDangers=finalPlan.events.some(x=>x==='laser')&&finalPlan.events.some(x=>x==='drone');
                   const darkFinal=selectedFinal&&finalPalette.colorBackdrop==='#02030b'&&
                    finalPalette.colorPanels==='#151124'&&finalPalette.colorMain==='#d82d5e';
                   d.draw();
                   return {starHit,starDodge,shortHit,shortDodge,selectedL3,spin,rotated,
                    moved,dropped,mineMoved,mineHit,mineDodge,
                    countBefore,pulseKill,pulseSafe,noElectric,selectedFinal,darkFinal,finalDangers,finalPalette,renderError:d.lastRenderError()};
                  }""")
                  print('ECHO_HAZARDS',width,json.dumps(result),flush=True)
                  assert result['starHit']==2 and result['starDodge']==3,result
                  assert result['shortHit']==2 and result['shortDodge']==3,result
                  assert result['selectedL3'] and abs(result['spin'])>.2 and result['rotated'],result
                  assert result['moved'] and result['dropped'] and result['mineMoved'],result
                  assert result['mineHit']==2 and result['mineDodge']==3,result
                  assert result['countBefore']>=1 and result['pulseKill'] and result['pulseSafe'],result
                  assert result['noElectric'] and not result['renderError'],result
                  assert result['darkFinal'] and result['finalDangers'],result
                  assert not errors,errors
                  page.close()
              browser.close()
          PY
      - name: Vérifier le fondu final de quinze secondes sur PC et mobile
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const window={};
          vm.runInNewContext(fs.readFileSync('echo-racer.js','utf8'),{window},{timeout:2500});
          const fade=window.ZebraEchoRacer.cinematicOutroFade;
          for(const duration of [120.529,142.812,192.287,217]){
           assert.equal(fade(duration-16,duration),0);
           assert.equal(fade(duration-15,duration),0);
           assert.ok(Math.abs(fade(duration-7.5,duration)-.5)<1e-6);
           assert.equal(fade(duration,duration),1);
          }
          console.log('CINEMATIC_FADE_MATH_OK: 15s and all four song lengths');
          NODE
          python3 -m http.server 8767 --bind 127.0.0.1 >/tmp/echo-outro-http.log 2>&1 &
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for width,height in [(1280,900),(390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height})
                  errors=[]
                  page.on('pageerror',lambda e: errors.append(str(e)))
                  page.add_init_script("localStorage.setItem('zebra.echo-racer.campaign.unlocked.v1','4')")
                  page.goto('http://127.0.0.1:8767/_verify_echo_hazards.html',wait_until='load')
                  page.wait_for_function("!!document.querySelector('#game')._echoDebug")
                  results=page.evaluate("""() => {
                   const d=document.querySelector('#game')._echoDebug;
                   const values=[];
                   for(const id of ['run','l2','l3','l4']){
                    d.menu();
                    if(!d.selectLevel(id))throw Error('Unable to select '+id);
                    d.start(false);
                    const duration=d.level().duration;
                    const set=(seconds)=>{
                     if(!d.testOutroClock(seconds))throw Error('Clock unavailable for '+id);
                     d.advance(.05);d.advance(.05);d.draw();
                     return d.snapshot();
                    };
                    const pre=set(duration-24);
                    d.injectWave([0],12);
                    d.injectHazard('laser',12);
                    const clearance=set(duration-21);
                    const entry=set(duration-15);
                    const empty=entry.waves.length===0&&entry.hazards.length===0&&
                     entry.pads.length===0&&entry.shields.length===0;
                    const mid=set(duration-7.5);
                    const screen=document.querySelector('#game .er-screen');
                    const score=screen.querySelector('.er-score-top');
                    const alphaMid=Number(getComputedStyle(score).opacity);
                    const midClass=screen.classList.contains('er-cinematic-outro');
                    const late=set(duration-.1);
                    const alphaLate=Number(getComputedStyle(score).opacity);
                    const canvas=screen.querySelector('canvas');
                    const ctx=canvas.getContext('2d');
                    const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;
                    let light=0;for(let i=0;i<pixels.length;i+=104)light+=pixels[i]+pixels[i+1]+pixels[i+2];
                    const renderError=d.lastRenderError();
                    const endEvent=d.simulateSongEnd();
                    const beforeCard=d.snapshot();
                    d.tickFinale(.6);
                    const card=d.snapshot();
                    d.menu();d.draw();
                    const reset=d.snapshot();
                    values.push({id,duration,preActive:pre.outro.active,
                     clearingActive:clearance.outro.active,
                     entryFade:entry.outro.fade,empty,
                     midFade:mid.outro.fade,alphaMid,midClass,
                     lateFade:late.outro.fade,alphaLate,light,
                     endEvent,preCardMode:beforeCard.mode,cardMode:card.mode,
                     cardVisible:card.finale.visible,reset:reset.outro.active,
                     renderError});
                   }
                   return values;
                  }""")
                  print('CINEMATIC_OUTRO_BROWSER',width,json.dumps(results),flush=True)
                  for x in results:
                      assert not x['preActive'] and not x['clearingActive'],x
                      assert x['empty'] and x['entryFade']==0,x
                      assert .47<x['midFade']<.53 and x['midClass'],x
                      assert .40<x['alphaMid']<.60,x
                      assert x['lateFade']>.995 and x['alphaLate']<.02,x
                      assert x['light']<35000,x
                      assert x['endEvent'] and x['preCardMode']=='finale',x
                      assert x['cardMode']=='finished' and x['cardVisible'],x
                      assert not x['reset'] and not x['renderError'],x
                  assert not errors,errors
                  page.close()
              browser.close()
          PY
