name: Vérifier ZebraPaint mobile
on:
  push:
    paths:
      - 'paint.js'
      - 'paint-responsive.css'
      - 'index.html'
      - '.github/workflows/verify-paint-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paint-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la syntaxe de ZebraPaint
        run: node --check paint.js
      - name: Tester calques multiples, re-sélection, ordre, export PNG et bouton Allumer sur Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("index.html").read_text()
          script=r'''<script>
          window.addEventListener("load",async()=>{
            const report={};
            try{
              const power=document.getElementById("power-btn");
              const symbol=power.querySelector(".zboot-power-svg");
              const style=getComputedStyle(symbol);
              report.powerSvg=!!symbol&&symbol.querySelectorAll("path").length===2
                &&Number.parseFloat(style.width)>=50&&Number.parseFloat(style.height)>=50
                &&style.display!=="none";
              const host=document.createElement("div");
              host.id="paint-test-host";
              host.style.cssText="position:absolute;top:20px;left:10px;width:350px;height:555px;z-index:9999;overflow:hidden;";
              host.className="zebra-game-body";
              document.body.appendChild(host);
              window.ZebraPaint.mount(host);
              const frame=host.querySelector(".zp-canvas-frame");
              const canvas=host.querySelector(".zp-canvas");
              const work=host.querySelector(".zp-work");
              const r=frame.getBoundingClientRect(),w=work.getBoundingClientRect();
              report.fitMobile=r.width<=w.width+1&&r.left>=w.left-2&&r.right<=w.right+2
                &&canvas.getBoundingClientRect().width<=w.width+1&&canvas.width===640&&canvas.height===400;
              function demoFile(color,name,width,height){
                const c=document.createElement("canvas");c.width=width;c.height=height;
                const cctx=c.getContext("2d");
                cctx.fillStyle=color;cctx.fillRect(0,0,width,height);
                return new Promise(resolve=>c.toBlob(blob=>resolve(new File([blob],name,{type:"image/png"})),"image/png"));
              }
              const input=host.querySelector("input[type=file]");
              async function importFile(file){
                Object.defineProperty(input,"files",{configurable:true,value:[file]});
                input.dispatchEvent(new Event("change",{bubbles:true}));
                await new Promise(resolve=>setTimeout(resolve,180));
              }
              await importFile(await demoFile("#ff0000","rouge.png",120,80));
              const layer=host.querySelector(".zp-imported-image");
              report.importLayer=!!layer;
              const before=layer.getBoundingClientRect(),frameRect=frame.getBoundingClientRect();
              report.importCentered=Math.abs((before.left+before.right)/2-(frameRect.left+frameRect.right)/2)<3
                &&Math.abs((before.top+before.bottom)/2-(frameRect.top+frameRect.bottom)/2)<3;
              function event(type,x,y){
                return new PointerEvent(type,{bubbles:true,cancelable:true,isPrimary:true,pointerId:31,pointerType:"touch",button:0,clientX:x,clientY:y});
              }
              function drag(node,dx,dy,handle=false){
                const target=handle?node.querySelector(".zp-image-resize"):node;
                const r=target.getBoundingClientRect(),x=r.left+r.width*.5,y=r.top+r.height*.5;
                target.dispatchEvent(event("pointerdown",x,y));
                window.dispatchEvent(event("pointermove",x+dx,y+dy));
                window.dispatchEvent(event("pointerup",x+dx,y+dy));
              }
              drag(layer,25,20);
              const afterMove=layer.getBoundingClientRect();
              report.drag=Math.abs(afterMove.left-before.left)>14&&Math.abs(afterMove.top-before.top)>10;
              const initialWidth=layer.getBoundingClientRect().width;
              drag(layer,28,18,true);
              report.resize=layer.getBoundingClientRect().width>initialWidth+10;
              report.layersUI=!!host.querySelector(".zp-layer-panel")&&host.querySelectorAll(".zp-layer-entry").length===1;
              report.applyVisible=getComputedStyle(host.querySelector(".zp-import-controls")).display!=="none";
              host.querySelector(".zp-apply-image").click();
              report.permanentAfterFinish=host.querySelectorAll(".zp-imported-image").length===1
                &&host.querySelector(".zp-import-controls").hidden
                &&getComputedStyle(layer).pointerEvents==="none";
              host.querySelector(".zp-layer-choice").click();
              report.reselect=layer.classList.contains("zp-image-selected")
                &&!host.querySelector(".zp-import-controls").hidden;
              // Deuxième image : ne doit ni remplacer ni détruire la première.
              await importFile(await demoFile("#0000ff","bleu.png",180,120));
              report.twoImages=host.querySelectorAll(".zp-imported-image").length===2
                &&host.querySelectorAll(".zp-layer-entry").length===2;
              const labels=()=>Array.from(host.querySelectorAll(".zp-layer-entry .zp-layer-name")).map(e=>e.textContent);
              report.layerOrderInitially=labels().join("|")==="bleu.png|rouge.png";
              // Remonter rouge au premier plan.
              host.querySelectorAll(".zp-layer-choice")[1].click();
              host.querySelectorAll(".zp-layer-entry")[1].querySelectorAll(".zp-layer-action")[1].click();
              report.reordered=labels().join("|")==="rouge.png|bleu.png";
              // Cacher puis réafficher le calque sélectionné.
              host.querySelector(".zp-layer-entry .zp-layer-action").click();
              report.hide=host.querySelector(".zp-imported-image:last-child").hidden;
              host.querySelector(".zp-layer-entry .zp-layer-action").click();
              report.show=!host.querySelector(".zp-imported-image:last-child").hidden;
              // Supprimer puis restaurer le premier calque par Annuler.
              host.querySelector(".zp-layer-entry .zp-layer-remove").click();
              report.delete=host.querySelectorAll(".zp-imported-image").length===1;
              host.querySelector(".zp-edits button").click();
              report.undoRestores=host.querySelectorAll(".zp-imported-image").length===2;
              // Le dessin conserve son fond blanc : seules les images sont des calques.
              const base=canvas.getContext("2d").getImageData(320,200,1,1).data;
              report.nondestructive=base[3]===0;
              let exportData="";
              function capture(e){
                const a=e.target.closest("a[download]");
                if(a&&a.download.startsWith("zebra-paint-")){
                  exportData=a.href;e.preventDefault();
                  document.removeEventListener("click",capture,true);
                }
              }
              document.addEventListener("click",capture,true);
              Array.from(host.querySelectorAll(".zp-menu .zp-button")).find(b=>b.textContent==="Enregistrer PNG").click();
              report.exportPNG=exportData.startsWith("data:image/png;base64,");
              if(report.exportPNG){
                const img=new Image();
                await new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;img.src=exportData;});
                const check=document.createElement("canvas");check.width=img.width;check.height=img.height;
                const cc=check.getContext("2d");cc.drawImage(img,0,0);
                const pix=cc.getImageData(0,0,check.width,check.height).data;
                let red=0,blue=0;
                for(let i=0;i<pix.length;i+=4){
                  if(pix[i]>235&&pix[i+1]<30&&pix[i+2]<30)red++;
                  if(pix[i]<30&&pix[i+1]<30&&pix[i+2]>235)blue++;
                }
                report.exportBoth=red>30&&blue>30;
              }else report.exportBoth=false;
            }catch(e){report.error=String(e.stack||e);}
            document.documentElement.dataset.paintReport=JSON.stringify(report);
            document.documentElement.dataset.paintStatus=Object.values(report).every(v=>v===true)?"ok":"failed";
          });
          </script>'''
          Path("_verify_paint_mobile.html").write_text(html.replace("</body>",script+"</body>"))
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zebra-paint-server.log 2>&1 &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --touch-events=enabled --window-size=390,860 --virtual-time-budget=5500 --dump-dom http://127.0.0.1:8765/_verify_paint_mobile.html > /tmp/zebra-paint-mobile.html 2>/tmp/zebra-paint-chrome.log
          grep -o 'data-paint-report="[^"]*"' /tmp/zebra-paint-mobile.html | tail -c 4000
          grep -o 'data-paint-status="[^"]*"' /tmp/zebra-paint-mobile.html
          grep -q 'data-paint-status="ok"' /tmp/zebra-paint-mobile.html
