name: Unblock stuck Pages deployment
on:
  push:
    paths:
      - '.github/workflows/unblock-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Annuler l'ancien déploiement Pages bloqué
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/response -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/UrosTrailovic/zebraos/pages/deployments/658791dfa1b389f9d015aec1a1bceb5a70e01ea4/cancel")
          echo "Réponse annulation : $status"
          cat /tmp/response
          if [ "$status" != "204" ] && [ "$status" != "404" ]; then exit 1; fi
