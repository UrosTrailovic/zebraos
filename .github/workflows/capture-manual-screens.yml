name: Capturer les vraies applications du manuel
on:
  push:
    branches: [main]
    paths:
      - 'tests/capture-manual.py'
      - 'zebraamp.js'
      - '.github/workflows/capture-manual-screens.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Installer le navigateur et les outils d'image
        run: python3 -m pip install --quiet playwright pillow
      - name: Capturer les applications ZebraOS
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zebra-manual-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1
          python3 tests/capture-manual.py
      - name: Publier les vraies captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/manual/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: capturer les applications pour les manuels Bienvenue"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Conserver les captures en artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-applications-manuel
          path: assets/manual/*.webp
          if-no-files-found: ignore
