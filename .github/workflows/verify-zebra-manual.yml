name: Vérifier Bienvenue et ses manuels
on:
  push:
    paths:
      - 'control-panel.js'
      - 'zebra-manual.js'
      - 'zebra-manual-content.js'
      - 'zebra-manual.css'
      - 'index.html'
      - 'tests/manual-browser.py'
      - '.github/workflows/verify-zebra-manual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe des programmes et références
        run: |
          node --check control-panel.js
          node --check zebra-manual.js
          node --check zebra-manual-content.js
          node - <<'JS'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          for(const name of ['zebra-manual-content.js','zebra-manual.js','zebra-manual.css']){
            if(!fs.existsSync(name)||!html.includes(name))throw new Error('Guide manquant : '+name);
          }
          const panel=fs.readFileSync('control-panel.js','utf8');
          if(!panel.includes('zcp-welcome-head')||!panel.includes('window.ZebraManual.open(root,"amp"'))
            throw new Error('L’accueil historique n’a pas été restauré');
          const manual=fs.readFileSync('zebra-manual.js','utf8');
          if(manual.includes('zm-stamp')||manual.includes('ARCHIVES')||manual.includes('zm-cover'))
            throw new Error('L’ancienne fausse notice est toujours présente');
          JS
      - name: Installer Playwright
        run: python3 -m pip install --quiet playwright
      - name: Tester Bienvenue et le retour aux guides sur PC / mobile
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/welcome-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER 2>/dev/null || true' EXIT
          sleep 1
          python3 tests/manual-browser.py
      - name: Captures des fenêtres
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bienvenue-originel-et-guides
          path: manual-test-screenshots/
          if-no-files-found: ignore
