name: Vérifier Echo Racer rendu mobile
on:
  push:
    paths:
      - 'echo-racer.js'
      - 'echo-racer.css'
      - 'app.js'
      - '.github/workflows/verify-echo-racer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-canvas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Monter Echo Racer dans Chromium mobile et analyser son canvas
        run: |
          cat > _verify_echo_mobile.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="/style.css">
          <link rel="stylesheet" href="/echo-racer.css">
          <style>html,body{margin:0;background:#222}.window{position:relative;height:900px;width:390px}
          .window-body{height:100%;width:100%;padding:0}</style>
          </head><body><div class="window focused">
            <div id="game" class="window-body zebra-game-body"></div>
          </div>
          <script>
          const errors=[];
          window.addEventListener("error",e=>errors.push(e.message+":"+e.filename+":"+e.lineno));
          window.addEventListener("unhandledrejection",e=>errors.push("PROMISE:"+e.reason));
          window.onerror=(message,src,line)=>{errors.push(String(message)+":"+line)};
          </script>
          <script src="/echo-racer.js"></script>
          <script>
          window.addEventListener("load",()=>{
           const root=document.querySelector("#game");
           try{
            window.ZebraEchoRacer.mount(root);
            const debug=root._echoDebug;
            const menuBoostEmpty=debug.gauges().charge===0
              &&root.querySelector(".er-dashboard-boost .er-dashboard-digits").getAttribute("aria-label")==="000";
            debug.openLevels();
            debug.controller("pulse");
            const startBoostEmpty=debug.gauges().charge===0;
            debug.advance(.05);
            const boostRecharging=debug.gauges().charge>0;
            setTimeout(()=>{
             const canvas=root.querySelector(".er-canvas");
             const context=canvas.getContext("2d",{willReadFrequently:true});
             const w=canvas.width,h=canvas.height;
             let pixels=[],nonblack=0;
             for(let y=50;y<h-50;y+=Math.max(10,Math.floor(h/12))){
              for(let x=30;x<w-30;x+=Math.max(10,Math.floor(w/12))){
               const p=context.getImageData(x,y,1,1).data;
               if(p[0]+p[1]+p[2]>36)nonblack++;
               pixels.push(p[0]+","+p[1]+","+p[2]);
              }
             }
             const snap=debug.snapshot();
             const hudTitles=[...root.querySelectorAll(".er-meter-label")];
             const speedBlades=[...root.querySelectorAll(".er-dashboard-speed .er-dashboard-led")];
             const boostBlades=[...root.querySelectorAll(".er-dashboard-boost .er-dashboard-led")];
             const segmentedTitles=hudTitles.length===4&&hudTitles.every(el=>el.querySelectorAll(".er-digit").length>0);
             const boostTrack=root.querySelector(".er-dashboard-boost .er-boost-track");
             const boostFill=root.querySelector(".er-dashboard-boost .er-boost-fill");
             const speedGhost=[...root.querySelectorAll(".er-dashboard-speed .er-gauge-ghost")];
             const boostIsContinuous=boostBlades.length===0&&!!boostTrack&&!!boostFill
               &&boostTrack.getAttribute("width")==="552"
               &&Number(boostFill.getAttribute("width"))>0
               &&root.querySelectorAll(".er-dashboard-boost .er-gauge-ghost").length===0;
             const spacedInactiveSpeed=speedBlades.length===26&&speedGhost.length===26
               &&(() => {
                const paths=speedGhost.map(el=>(el.getAttribute("d").match(/-?\d+(?:\.\d+)?/g)||[]).map(Number));
                return paths.every((p,i)=>p.length===8&&
                 (i===0||p[0]-paths[i-1][2]>4));
               })();
             const parallelArcs=boostIsContinuous&&spacedInactiveSpeed;
             const yAt=i=>parseFloat(speedBlades[i].style.getPropertyValue("--gauge-y"))*1.6;
             const firstRise=Array.from({length:8},(_,i)=>yAt(i)-yAt(i+1));
             const straightRails=firstRise.length===8&&firstRise.every(x=>Math.abs(x)<.015);
             const actualCenters=root.querySelectorAll(".er-dashboard-readout");
             const dashboardRect=root.querySelector(".er-dashboard").getBoundingClientRect();
             const readoutCenters=[...actualCenters].map(el=>{
              const r=el.getBoundingClientRect();
              return (r.left+r.right)/2;
             });
             const balancedEndPods=readoutCenters.length===2
               &&Math.abs((readoutCenters[0]-dashboardRect.left)/dashboardRect.width-.155)<.015
               &&Math.abs((readoutCenters[1]-dashboardRect.left)/dashboardRect.width-.845)<.015;
             const gaugeMeasurements=[...root.querySelectorAll(".er-dashboard-row")].map(row=>{
               const bounds=el=>el.getBoundingClientRect(),center=x=>(x.left+x.right)/2;
               const pod=bounds(row.querySelector(".er-dashboard-readout"));
               const titleEl=row.querySelector(".er-dashboard-name");
               const title=bounds(titleEl);
               const digitsEl=row.querySelector(".er-dashboard-digits");
               const digits=bounds(digitsEl);
               const numberLine=bounds(row.querySelector(".er-dashboard-number-line"));
               const unitEl=row.querySelector(".er-dashboard-unit");
               const unit=bounds(unitEl);
               const glass=bounds(root.querySelector(".er-dashboard"));
               return {titleCenterError:+Math.abs(center(title)-center(pod)).toFixed(2),
                numberCenterError:+Math.abs(center(numberLine)-center(pod)).toFixed(2),
                actualTitleWidth:+title.width.toFixed(1),
                actualNumberWidth:+numberLine.width.toFixed(1),
                groupCenterError:+Math.abs(center({left:digits.left,right:unit.right})-center(pod)).toFixed(2),
                unitVerticalError:+Math.abs((digits.top+digits.bottom)/2-(unit.top+unit.bottom)/2).toFixed(2),
                titleInside:title.top>=glass.top+glass.height*.10&&title.bottom<digits.top+3,
                titleItalic:getComputedStyle(titleEl).fontStyle==="italic",
                unitItalic:getComputedStyle(unitEl).fontStyle==="italic",
                digitsItalic:getComputedStyle(digitsEl).transform!=="none"};
             });
             // The USER intentionally offset titles and digits separately.
             // Do not fail them against the obsolete auto-centering assumption.
             const positionDefaults=debug.lcdEditor().layout;
             const defaultHeightsMatch=positionDefaults.speedTitle.y===16.5
               &&positionDefaults.boostTitle.y===positionDefaults.speedTitle.y
               &&positionDefaults.boostDigits.y===positionDefaults.speedDigits.y
               &&positionDefaults.boostUnit.y===positionDefaults.speedUnit.y;
             const layoutOffsetsMeasured=Object.entries({
               speedTitle:".er-dashboard-speed .er-dashboard-name",
               speedDigits:".er-dashboard-speed .er-dashboard-digits",
               speedUnit:".er-dashboard-speed .er-dashboard-unit",
               boostTitle:".er-dashboard-boost .er-dashboard-name",
               boostDigits:".er-dashboard-boost .er-dashboard-digits",
               boostUnit:".er-dashboard-boost .er-dashboard-unit"
             }).every(([id,selector])=>{
               const expected=positionDefaults[id];
               const shift=getComputedStyle(root.querySelector(selector)).translate;
               const values=(shift.match(/-?[0-9.]+/g)||[]).map(Number);
               return values.length===2&&
                Math.abs(values[0]-expected.x*dashboardRect.width/100)<.9&&
                Math.abs(values[1]-expected.y*dashboardRect.height/100)<.9;
             });
             const gaugeTitleAndUnits=gaugeMeasurements.length===2
               &&gaugeMeasurements.every(v=>v.titleInside&&v.titleItalic&&v.unitItalic&&v.digitsItalic)
               &&defaultHeightsMatch&&layoutOffsetsMeasured;
             const ledUpright=speedBlades.every(el=>{
                const n=(el.getAttribute("d").match(/-?\d+(?:\.\d+)?/g)||[]).map(Number);
                return n.length===8&&Math.abs(n[2]-n[0]-14)<.1
                 &&Math.abs(n[4]-n[2]+6)<.1;
               });
             const shellCss=getComputedStyle(root.querySelector(".er-dashboard")).backgroundImage;
             const frameLoaded=shellCss.includes("echo%20machine%20bg%201.png")||shellCss.includes("echo machine bg 1.png");
             const dimLayer=root.querySelector(".er-dashboard-speed .er-gauge-leds-ghost");
             const glowingLayer=root.querySelector(".er-dashboard-speed .er-gauge-leds-lit");
             const neonReal=!!dimLayer&&!!glowingLayer
               &&getComputedStyle(glowingLayer).filter!=="none"
               &&speedBlades.every(el=>getComputedStyle(el).filter==="none")
               &&getComputedStyle(dimLayer.querySelector("path")).fill==="rgb(114, 43, 114)";
             const italicReadouts=[...root.querySelectorAll(".er-dashboard-readout .er-dashboard-name")].every(el=>
               getComputedStyle(el).transform!=="none");
             const railBoxes=[...root.querySelectorAll(".er-dashboard-bar")].map(el=>el.getBoundingClientRect());
             const railCenters=railBoxes.map(r=>(r.left+r.right)/2);
             const physicalCenter=(dashboardRect.left+dashboardRect.right)/2;
             const barsCentered=railBoxes.length===2&&railBoxes.every(r=>r.width<dashboardRect.width*.55)
               &&railCenters.every(x=>Math.abs(x-physicalCenter)<1.5)
               &&Math.abs(railCenters[0]-railCenters[1])<.5;
             const hudFits=[...root.querySelectorAll(".er-meter")].every(el=>el.scrollWidth<=el.clientWidth+2);
             const gaugeFits=root.querySelector(".er-dashboard").getBoundingClientRect().width>300;
             const slider=root.querySelector(".er-steering-track");
             const box=slider.getBoundingClientRect();
             const pointer=(type,x,id=47)=>slider.dispatchEvent(new PointerEvent(type,{
              bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",button:0,
              clientX:x,clientY:box.top+box.height/2
             }));
             pointer("pointerdown",box.right-8);
             const steeringRight=debug.steering().value>.7;
             pointer("pointerup",box.right-8);
             const steeringCentered=debug.steering().value===0
              &&slider.getAttribute("aria-valuenow")==="0";
             // Actual hit-testing at the very top and bottom of the left controls,
             // not only on the visible narrow slider track.
             const leftPanel=root.querySelector(".zt-dpad");
             const panelRect=leftPanel.getBoundingClientRect();
             const testEdge=(y,id)=>{
              const x=Math.min(box.right-8,panelRect.right-10);
              const target=document.elementFromPoint(x,y);
              if(!target||!leftPanel.contains(target))return false;
              const make=type=>target.dispatchEvent(new PointerEvent(type,{
               bubbles:true,cancelable:true,pointerId:id,pointerType:"touch",button:0,
               clientX:x,clientY:y
              }));
              make("pointerdown");
              const moved=debug.steering().value>.5;
              make("pointerup");
              return moved&&debug.steering().value===0;
             };
             const fullHeightTouch=testEdge(panelRect.top+3,101)
              &&testEdge(panelRect.bottom-3,102);
             const rect=name=>root.querySelector(name).getBoundingClientRect();
             const screenBox=rect(".er-screen"),hudBox=rect(".er-hud"),
              gaugeBox=rect(".er-dashboard"),padBox=rect(".er-pad");
             const mobileOrder=screenBox.top<gaugeBox.top
              &&gaugeBox.bottom<=hudBox.top+3&&hudBox.bottom<=padBox.top+3;
             const scoreLcd=getComputedStyle(root.querySelector(".er-meter-number")).color;
             const gaugeLcd=getComputedStyle(root.querySelector(".er-dashboard-digits")).color;
             // Both displays stay in the same pink-purple family, while the
             // new machine's main digits get the stronger white-hot core.
             const rgb=v=>(v.match(/[\d.]+/g)||[]).slice(0,3).map(Number);
             const scoreRGB=rgb(scoreLcd),gaugeRGB=rgb(gaugeLcd);
             const scoreAndGaugeMatch=scoreRGB.length===3&&gaugeRGB.length===3
               &&scoreRGB[0]>scoreRGB[1]&&scoreRGB[2]>scoreRGB[1]
               &&gaugeRGB[0]>gaugeRGB[1]&&gaugeRGB[2]>gaugeRGB[1];
             const pad=root.querySelector(".er-pad");
             const aButton=pad.querySelector(".zt-a"),bButton=pad.querySelector(".zt-b"),
              selectButton=pad.querySelector(".zt-select");
             const controlsWithoutTetris=pad.querySelectorAll("img").length===0
               &&!pad.classList.contains("zt-skin-ready")
               &&!getComputedStyle(pad).backgroundImage.includes("tetris-controls")
               &&root.querySelector(".er-steering-label")===null;
             const buttonsInOrder=!!aButton&&!!bButton&&!!selectButton
               &&aButton.getBoundingClientRect().left<bButton.getBoundingClientRect().left
               &&aButton.getBoundingClientRect().width>40
               &&bButton.getBoundingClientRect().width>40
               &&getComputedStyle(aButton).color===getComputedStyle(bButton).color
               &&getComputedStyle(aButton).color!=="rgba(0, 0, 0, 0)"
               &&getComputedStyle(selectButton).display!=="none";
             const ab=pad.querySelector(".zt-ab"),abStyle=getComputedStyle(ab);
             const cleanButtonPlate=abStyle.transform==="none"
               &&abStyle.backgroundImage==="none"
               &&parseFloat(abStyle.borderTopWidth)===0;
             const aFace=new DOMMatrix(getComputedStyle(aButton).transform);
             const bFace=new DOMMatrix(getComputedStyle(bButton).transform);
             const uprightStagger=aButton.getBoundingClientRect().top>bButton.getBoundingClientRect().top+9
               &&Math.abs(aFace.b)<.01&&Math.abs(aFace.c)<.01
               &&Math.abs(bFace.b)<.01&&Math.abs(bFace.c)<.01;
             // Gameplay regressions: a late pickup is still collectible,
             // full-health shields are absent, and distant pulse breaks a wall.
             const noShieldsAtFull=debug.snapshot().lives===3
               &&debug.snapshot().shields.length===0;
             debug.simulateHit();
             const shieldEligible=debug.snapshot().lives===2;
             debug.injectPickup("shield",[0,1],2.45);
             debug.advance(.05);
             const healed=debug.snapshot();
             const shieldRecovered=healed.lives===3&&healed.shieldFlash>0
               &&root.querySelector(".er-shield-collect").classList.contains("er-shield-collected")
               &&healed.shields.length===0;
             // Behind the former fixed 1.6 collision plane, but still on the pad.
             debug.injectPickup("pad",[0,1,2],1.22);
             debug.advance(.05);
             const boosted=debug.snapshot().padBoostTime>2;
             const wall=debug.injectWave([0,1],9.3);
             const beforePulse=debug.snapshot().pulseCharge;
             debug.pulse();
             const pulsed=debug.snapshot();
             const longPulse=wall.cleared&&pulsed.pulseCharge===beforePulse-1
               &&pulsed.pulseFx>0&&pulsed.pulseHitFx>0;
             // Test the actual temporary CONFIG button and input workflow.
             const configBtn=root.querySelector(".er-config-toggle");
             configBtn.click();
             const editorOpened=debug.lcdEditor().open&&
               root.querySelector(".er-config-panel").getBoundingClientRect().width>200;
             const selection=root.querySelector(".er-config-select");
             selection.value="speedDigits";
             selection.dispatchEvent(new Event("change",{bubbles:true}));
             const horizontal=root.querySelectorAll(".er-config-range")[0];
             horizontal.value="9.5";
             horizontal.dispatchEvent(new Event("input",{bubbles:true}));
             const editorSaved=debug.lcdEditor().layout.speedDigits.x===9.5
               &&(localStorage.getItem("zebra.echo-racer.lcd.positions.v2.mobile")||"").includes("9.5")
               &&getComputedStyle(root.querySelector(".er-dashboard-speed .er-dashboard-digits")).translate!=="none";
             const movable=root.querySelector(".er-dashboard-speed .er-dashboard-digits");
             const movableRect=movable.getBoundingClientRect();
             const startX=movableRect.left+movableRect.width/2;
             const startY=movableRect.top+movableRect.height/2;
             const drag=(type,x,y)=>movable.dispatchEvent(new PointerEvent(type,{
              bubbles:true,cancelable:true,pointerId:907,pointerType:"touch",button:0,
              clientX:x,clientY:y
             }));
             drag("pointerdown",startX,startY);
             drag("pointermove",startX+22,startY+6);
             drag("pointerup",startX+22,startY+6);
             const editorDragWorks=debug.lcdEditor().layout.speedDigits.x>9.5
               &&debug.lcdEditor().layout.speedDigits.y>0;
             root.querySelector(".er-config-action").click();
             const editorReset=debug.lcdEditor().layout.speedDigits.x===0&&debug.lcdEditor().layout.speedDigits.y===18;
             debug.lcdClose();
             const editorClosed=!debug.lcdEditor().open;
             const report={errors,mode:snap.mode,score:snap.score,
              boostIsContinuous,spacedInactiveSpeed,editorOpened,editorSaved,editorDragWorks,editorReset,editorClosed,
              noShieldsAtFull,shieldEligible,shieldRecovered,boosted,longPulse,
              fullHeightTouch,cleanButtonPlate,uprightStagger,controlsWithoutTetris,buttonsInOrder,
              steeringRight,steeringCentered,mobileOrder,scoreAndGaugeMatch,
              positions:[screenBox.top,hudBox.top,gaugeBox.top,padBox.top].map(Math.round),
              segmentedTitles,parallelArcs,straightRails,balancedEndPods,gaugeTitleAndUnits,gaugeMeasurements,positionDefaults,defaultHeightsMatch,layoutOffsetsMeasured,railCenters,physicalCenter,firstRise,ledUpright,italicReadouts,menuBoostEmpty,startBoostEmpty,boostRecharging,hudFits,gaugeFits,frameLoaded,neonReal,barsCentered,leds:boostBlades.length,
              canvas:{width:w,height:h,nonblack,unique:new Set(pixels).size},
              screen:root.querySelector(".er-screen").getBoundingClientRect().height,
              hud:root.querySelector(".er-hud").getBoundingClientRect().height,
              gauge:root.querySelector(".er-dashboard").getBoundingClientRect().height};
             console.log("ECHO_MOBILE_REPORT",JSON.stringify(report));
             document.body.dataset.report=JSON.stringify(report);
             document.body.dataset.result=errors.length===0&&w>200&&h>200&&snap.mode==="running"
              &&snap.score>0&&nonblack>20&&report.canvas.unique>25&&segmentedTitles&&parallelArcs&&hudFits&&gaugeFits&&steeringRight&&steeringCentered&&mobileOrder&&scoreAndGaugeMatch&&controlsWithoutTetris&&buttonsInOrder&&cleanButtonPlate&&uprightStagger&&fullHeightTouch&&noShieldsAtFull&&shieldEligible&&shieldRecovered&&boosted&&longPulse&&frameLoaded&&neonReal&&barsCentered&&ledUpright&&italicReadouts&&straightRails&&balancedEndPods&&gaugeTitleAndUnits&&boostIsContinuous&&spacedInactiveSpeed&&editorOpened&&editorSaved&&editorDragWorks&&editorReset&&editorClosed&&menuBoostEmpty&&startBoostEmpty&&boostRecharging?"ok":"failed";
            },1200);
           }catch(e){errors.push("MOUNT:"+e.stack);document.body.dataset.report=JSON.stringify({errors});document.body.dataset.result="failed";}
          });
          </script></body></html>
          HTML
          python3 -m http.server 8765 >/tmp/echo-http.log 2>&1 &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,900 --virtual-time-budget=3900 --dump-dom http://127.0.0.1:8765/_verify_echo_mobile.html >/tmp/echo-test.html 2>/tmp/echo-chrome.log
          grep -o 'data-report="[^"]*"' /tmp/echo-test.html | head -1 || true
          grep -o 'data-result="[^"]*"' /tmp/echo-test.html | head -1 || true
          grep -q 'data-result="ok"' /tmp/echo-test.html

          # Desktop regression: the game must fill the width, with NO empty
          # right column beside it, and cockpit instruments stacked below.
          cat > _verify_echo_desktop.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="/style.css">
          <link rel="stylesheet" href="/echo-racer.css">
          <style>html,body{margin:0;background:#222}
          .window{position:relative;width:744px;height:788px}
          .window-body{height:100%;width:100%;padding:0}</style>
          </head><body><div class="window focused">
          <div class="window-body zebra-game-body" id="game"></div></div>
          <script>
          const errors=[];
          window.addEventListener("error",e=>errors.push(e.message));
          window.addEventListener("unhandledrejection",e=>errors.push(String(e.reason)));
          </script>
          <script src="/echo-racer.js"></script>
          <script>
          addEventListener("load",()=>{
           const root=document.querySelector("#game");
           try{
            window.ZebraEchoRacer.mount(root);
            const debug=root._echoDebug;
            debug.openLevels();
            const rect=sel=>root.querySelector(sel).getBoundingClientRect();
            const levelBox=rect(".er-level-picker");
            const screenMenu=rect(".er-screen");
            const menuCentered=Math.abs((levelBox.left+levelBox.right)/2-
              (screenMenu.left+screenMenu.right)/2)<18
              &&levelBox.top>screenMenu.top&&levelBox.bottom<screenMenu.bottom+2;
            debug.controller("pulse");
            debug.advance(.05);
            setTimeout(()=>{
             const wrap=rect(".zg.er"),screen=rect(".er-screen"),dash=rect(".er-dashboard"),
              hud=rect(".er-hud"),footer=rect(".er-footer");
             const canvas=root.querySelector("canvas.er-canvas");
             const context=canvas.getContext("2d",{willReadFrequently:true});
             const colors=new Set();let bright=0;
             for(let y=40;y<canvas.height-40;y+=Math.max(18,Math.floor(canvas.height/14))){
              for(let x=40;x<canvas.width-40;x+=Math.max(18,Math.floor(canvas.width/16))){
               const p=context.getImageData(x,y,1,1).data;
               colors.add(p[0]+","+p[1]+","+p[2]);
               if(p[0]+p[1]+p[2]>40)bright++;
              }
             }
             const order=screen.bottom<=dash.top+3&&dash.bottom<=hud.top+3
              &&hud.bottom<=footer.top+3;
             const fullWidth=screen.width>=wrap.width*.95
              &&dash.width>=wrap.width*.95&&hud.width>=wrap.width*.95;
             const fits=screen.height>=220&&footer.bottom<=wrap.bottom+3
              &&screen.left>=wrap.left-3&&screen.right<=wrap.right+3;
             const noSideColumn=getComputedStyle(root.querySelector(".er-frame")).display==="contents";
             const report={errors,menuCentered,order,fullWidth,fits,noSideColumn,
              screen:{w:screen.width,h:screen.height},dashboard:dash.width,
              hud:hud.width,footer:footer.width,canvas:{w:canvas.width,h:canvas.height,bright,unique:colors.size},
              positions:[screen.top,dash.top,hud.top,footer.top].map(Math.round)};
             document.body.dataset.report=JSON.stringify(report);
             document.body.dataset.result=errors.length===0&&menuCentered&&order
              &&fullWidth&&fits&&noSideColumn&&bright>25&&colors.size>25?"ok":"failed";
            },800);
           }catch(error){errors.push(error.stack||String(error));
            document.body.dataset.result="failed";document.body.dataset.report=JSON.stringify({errors});}
          });
          </script></body></html>
          HTML
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1000,1000 --virtual-time-budget=4000 --dump-dom http://127.0.0.1:8765/_verify_echo_desktop.html >/tmp/echo-desktop.html 2>/tmp/echo-desktop-chrome.log
          grep -o 'data-report="[^"]*"' /tmp/echo-desktop.html | head -1 || true
          grep -o 'data-result="[^"]*"' /tmp/echo-desktop.html | head -1 || true
          grep -q 'data-result="ok"' /tmp/echo-desktop.html

          # Capture actual rendered phosphor gauge in headless Chromium.
          # The image is only logged for visual verification by the author.
          cat > _verify_echo_gauge.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="/style.css">
          <link rel="stylesheet" href="/echo-racer.css">
          <style>
          html,body{margin:0;background:#14081c;overflow:hidden}
          .window{width:840px;height:178px;position:relative}
          .window-body{width:100%;height:100%;padding:0}
          .zebra-game-body .zg.er{width:840px!important;height:178px!important;min-height:178px!important;padding:8px!important;gap:0!important}
          .zebra-game-body .zg.er .er-frame{display:contents!important}
          .zebra-game-body .zg.er .er-screen,
          .zebra-game-body .zg.er .er-heading,
          .zebra-game-body .zg.er .er-hud,
          .zebra-game-body .zg.er .er-pad{display:none!important}
          .zebra-game-body .zg.er .er-dashboard{
           display:block!important;position:relative!important;order:0!important;
           width:824px!important;max-width:824px!important;
           height:162px!important;min-height:162px!important;flex:0 0 162px!important;
           margin:0!important
          }
          </style></head><body>
          <div class="window"><div class="window-body zebra-game-body" id="game"></div></div>
