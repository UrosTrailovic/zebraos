name: Vérifier les nouveaux dangers Echo Racer
on:
  push:
    paths:
      - 'echo-racer.js'
      - 'app.js'
      - '.github/workflows/verify-echo-hazards.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hazards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe et répartition exacte par niveau
        run: |
          node --check echo-racer.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('echo-racer.js','utf8'),context,{timeout:2500});
          const pick=context.window.ZebraEchoRacer.hazardTypeForLevel;
          const allowed={run:[],l2:['sweeper'],l3:['electric','sweeper'],l4:['electric','sweeper','drone'],free:[]};
          for(const [level,expected] of Object.entries(allowed)){
           const types=new Set();
           for(let i=1;i<=180;i++){
            const type=pick(level,i);
            if(i<5)assert.equal(type,null,'Special appeared during introduction');
            if(type)types.add(type);
           }
           assert.deepEqual([...types].sort(),expected.sort(),level+' families mismatch');
          }
          console.log('LEVEL_HAZARDS_PASS: four intended family sets and clear introduction');
          NODE
      - name: Préparer le navigateur
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Tester les collisions et les échappatoires sur PC et mobile
        run: |
          cat > _verify_echo_hazards.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="/style.css">
          <link rel="stylesheet" href="/echo-racer.css">
          <style>body{margin:0;background:#222}.window{position:relative;width:100%;height:880px}
          .window-body{height:100%;width:100%;padding:0}</style></head>
          <body><div class="window focused"><div id="game" class="window-body zebra-game-body"></div></div>
          <script src="/echo-racer.js"></script><script>
          window.addEventListener('load',()=>window.ZebraEchoRacer.mount(document.querySelector('#game')));
          </script></body></html>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/echo-hazards-http.log 2>&1 &
          python3 - <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              for width,height in [(1280,900),(390,844)]:
                  page=browser.new_page(viewport={'width':width,'height':height})
                  errors=[]
                  page.on('pageerror',lambda e: errors.append(str(e)))
                  page.add_init_script("localStorage.setItem('zebra.echo-racer.lab.v1', JSON.stringify({invincible:false}));")
                  page.goto('http://127.0.0.1:8765/_verify_echo_hazards.html',wait_until='load')
                  page.wait_for_function("!!document.querySelector('#game')._echoDebug")
                  results=page.evaluate("""() => {
                   const d=document.querySelector('#game')._echoDebug;
                   function simulate(type,hit){
                    d.testPhase('p1');d.setTestInvincible(false);
                    const z=d.hitDepth+(type==='drone'?4.5:.4);
                    const h=d.injectHazard(type,z);
                    if(!h)throw Error('Could not inject '+type);
                    const aim=type==='sweeper'?h.rotation:type==='electric'?h.center:0;
                    d.setShipAngle(aim);
                    if(type==='drone'){
                     d.advance(.05);
                     if(!hit)d.setShipAngle(aim+Math.PI/2);
                    }else if(!hit)d.setShipAngle(aim+Math.PI/2);
                    const trace=[];
                    for(let i=0;i<48;i++){
                     d.advance(.05);
                     if(i<9)trace.push({step:i,z:h.z,hit:h.hit,fired:h.fired,lives:d.snapshot().lives,angle:d.snapshot().angle,mode:d.snapshot().mode,invuln:d.snapshot().invuln,invincible:d.snapshot().lab.invincible});
                    }
                    d.draw();
                    return {lives:d.snapshot().lives,render:d.lastRenderError(),hazards:d.snapshot().hazards,mode:d.snapshot().mode,travel:d.snapshot().travel,invincible:d.snapshot().lab.invincible,hidden:document.hidden,trace};
                   }
                   const sweptHit=simulate('sweeper',true),sweptSafe=simulate('sweeper',false);
                   const electricHit=simulate('electric',true),electricSafe=simulate('electric',false);
                   const droneHit=simulate('drone',true),droneSafe=simulate('drone',false);
                   d.testPhase('p1');d.setTestInvincible(false);const target=d.injectHazard('drone',d.hitDepth+5);
                   d.pulse();const pulseDestroyed=target.cleared;
                   for(let i=0;i<45;i++)d.advance(.05);
                   return {sweptHit:sweptHit.lives,sweptSafe:sweptSafe.lives,
                    electricHit:electricHit.lives,electricSafe:electricSafe.lives,
                    droneHit:droneHit.lives,droneSafe:droneSafe.lives,
                    pulseDestroyed,pulseSafe:d.snapshot().lives===3,
                    diagnostic:{sweptHit,electricHit,droneHit},renderErrors:[sweptHit.render,sweptSafe.render,electricHit.render,electricSafe.render,droneHit.render,droneSafe.render]};
                  }""")
                  print('HAZARD_BROWSER',width,json.dumps(results),flush=True)
                  assert results['sweptHit']==2 and results['sweptSafe']==3,results
                  assert results['electricHit']==2 and results['electricSafe']==3,results
                  assert results['droneHit']==2 and results['droneSafe']==3,results
                  assert results['pulseDestroyed'] and results['pulseSafe'],results
                  assert not any(results['renderErrors']),results
                  assert not errors,errors
                  page.close()
              browser.close()
          PY
