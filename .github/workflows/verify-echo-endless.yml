name: Vérifier Echo Racer endless, plastique et sessions
on:
  push:
    paths:
      - 'echo-racer.js'
      - 'echo-racer.css'
      - 'app.js'
      - 'index.html'
      - '.github/workflows/verify-echo-endless.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endless-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider la syntaxe et les accès
        run: |
          node --check echo-racer.js
          node --check app.js
          node --check wallpaper.js
          node - <<'JS'
          const fs=require('node:fs');
          const app=fs.readFileSync('app.js','utf8');
          const js=fs.readFileSync('echo-racer.js','utf8');
          const css=fs.readFileSync('echo-racer.css','utf8');
          const index=fs.readFileSync('index.html','utf8');
          const checks={
            sessions:app.includes('var users=[["zebra","Zebra"')&&!app.includes('"Visiteur","Session publique"'),
            adminOnlyEcho:app.includes('name==="racer"&&session!=="admin"'),
            noLevelMenu:js.includes('const levelButtons=[]')&&js.includes('if(mode==="menu")start();'),
            songDropMap:js.includes('MUSIC_DROP_AT=68')&&js.includes('MUSIC_SECOND_DROP_AT=162'),
            plasticTexture:css.includes('data:image/webp;base64,'),
            transitionAndSpeed:js.includes('ENCORE_TRANSITION_SECONDS=5')
              &&js.includes('function beginEncore()')
              &&js.includes('const base=clamp(lab.baseSpeed')
              &&js.includes('lab.boostPadsEnabled&&padBoostTime>0?lab.boostPadSpeed'),
            hasTuning:js.includes('const LAB_DEFAULTS')&&js.includes('er-lab-window')&&
              js.includes('labVisualTravel')&&css.includes('er-lab-impact'),
            boostPadTuning:js.includes('"id":"boostPadSpeed"')
              &&js.includes('lab.boostPadsEnabled&&padBoostTime>0?lab.boostPadSpeed')
              &&js.includes('"id":"boostPadsEnabled"')
              &&js.includes('if(!lab.boostPadsEnabled)'),
            themeArchitecture:js.includes('function labTint(hex,intensity')
              &&js.includes('lab.colorBackdrop')&&js.includes('lab.colorPanels')
              &&js.includes('lab.colorMain')&&js.includes('lab.colorHazard'),
            editorCategories:js.includes('LAB_DESCRIPTIONS')
              &&js.includes('er-lab-categories')
              &&js.includes('er-lab-section-group')
              &&css.includes('.er-lab-category.selected'),
            secondSong:fs.existsSync('assets/games/echoraccersongpt2.mp3')
              &&fs.statSync('assets/games/echoraccersongpt2.mp3').size>100000
              &&js.includes('musicUrlPhase3="/assets/games/echoraccersongpt2.mp3')
              &&js.includes('startMusicAtPhase("p3",0)'),
            phaseProfiles:js.includes('const PHASES=')&&js.includes('phaseProfiles=loadPhaseProfiles()')
              &&app.includes('window.ZebraEchoLabWindow=')
              &&css.includes('.er-lab-window.er-lab-native'),
            noZebraControls:!css.includes('textile.png')&&!index.includes('href="echo-racer-mobile-zebra.css')
          };
          console.log('STATIC_CHECKS',JSON.stringify(checks));
          if(Object.values(checks).some(v=>!v))process.exit(1);
          // The real music director gets tested at both measured transitions.
          const start=js.indexOf(' function directMusicPressure(dt){');
          const end=js.indexOf(' function advance(dt){',start);
          if(start<0||end<0)throw Error('director function absent');
          const body=js.slice(start,end);
          const run=(seconds,elapsed,initialStage,muted=false)=>{
            const fn=new Function('clock','time','initial','muted',`
              let directorStage=initial,musicDropSurge=0,musicLoops=0,
                  message='',messageLife=0,flash=0,soundEnabled=!muted;
              const MUSIC_SECOND_DROP_AT=162,MUSIC_DROP_AT=68;
              const music=muted?null:{paused:false,currentTime:clock};
              let elapsed=time;
              const beep=()=>{};
              ${body}
              directMusicPressure(.05);
              return {stage:directorStage,message,boost:musicDropSurge};
            `);
            return fn(seconds,elapsed,initialStage,muted);
          };
          const slow=run(66,66,1),drop=run(68,68,1),
                second=run(162,162,3),noAudio=run(162,162,3,true);
          const phases={beforeDrop:slow.stage===1,firstDrop:drop.stage===2&&drop.boost>1,
            secondDrop:second.stage===4&&second.boost>1,
            fallbackNoAudio:noAudio.stage===4};
          console.log('MUSIC_DIRECTOR',JSON.stringify(phases));
          if(Object.values(phases).some(v=>!v))process.exit(1);
          JS
      - name: Vérifier dans Chromium réel (PC et mobile)
        run: |
          cat >_verify_echo_endless.html <<'HTML'
          <!doctype html><html lang="fr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="/style.css">
          <link rel="stylesheet" href="/echo-racer.css">
          <style>
           html,body{margin:0;background:#19191d}
           .window{width:100%;max-width:750px;height:790px}
           .window-body{width:100%;height:100%;padding:0}
          </style></head><body><div class="window focused">
           <div id="game" class="window-body zebra-game-body"></div>
          </div>
          <script src="/echo-racer.js"></script>
          <script>
           const errors=[];addEventListener('error',e=>errors.push(e.message));
           addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
           addEventListener('load',()=>{
            const result={};
            try{
             const host=document.getElementById('game');
             const nativeTest=new URLSearchParams(location.search).has('nativeLab');
             if(nativeTest){
               window.ZebraEchoLabWindow={
                 open:()=>{
                   let win=document.querySelector('.window[data-app-id="racer-lab"]');
                   if(!win){
                     win=document.createElement('div');
                     win.className='window';win.dataset.appId='racer-lab';
                     Object.assign(win.style,{
                       position:'fixed',left:'540px',top:'35px',width:'460px',height:'640px',
                       zIndex:'2000',background:'#10101b'
                     });
                     const title=document.createElement('div');
                     title.className='titlebar';title.textContent='ECHO RACER — CONFIG TEST';
                     const body=document.createElement('div');body.className='window-body';
                     win.append(title,body);document.body.appendChild(win);
                   }
                   return win.querySelector('.window-body');
                 },
                 isOpen:()=>!!document.querySelector('.window[data-app-id="racer-lab"]'),
                 close:()=>{
                   const win=document.querySelector('.window[data-app-id="racer-lab"]');
                   if(win){
                     const body=win.querySelector('.window-body');
                     if(body&&body._zebraDispose)body._zebraDispose();
                     win.remove();
                   }
                 }
               };
             }
             window.ZebraEchoRacer.mount(host);
             const debug=host._echoDebug;
             const levelBox=host.querySelector('.er-level-picker');
             const pad=host.querySelector('.er-pad');
             const footer=host.querySelector('.er-footer');
             const button=host.querySelector('.er-overlay-button');
             result.levelPickerHidden=levelBox.hidden&&getComputedStyle(levelBox).display==='none';
             result.playLabel=button.textContent.includes('JOUER');
             const testBtn=host.querySelector('.er-test-button');
             result.testEntry=!!testBtn&&testBtn.textContent.trim()==='TEST'&&
               testBtn.getBoundingClientRect().top>=button.getBoundingClientRect().bottom-10;
             const oldBest=debug.snapshot().best;
             testBtn.click();
             const testSnap=debug.snapshot();
             result.testBlueNow=testSnap.mode==='running'&&testSnap.testMode&&
               testSnap.encore.mode==='blue'&&testSnap.directorStage>=5;
             const tuner=host.querySelector('.er-lab-toggle');
             const mobileViewport=matchMedia('(max-width:700px)').matches;
             result.configButton=!!tuner&&
               (mobileViewport?getComputedStyle(tuner).display==='none':
                getComputedStyle(tuner).display!=='none');
             if(!mobileViewport){
               tuner.click();
               const lab=document.querySelector('.er-lab-window');
               result.detachedWorkshop=lab.isConnected&&!host.contains(lab)
                 &&(nativeTest?lab.closest('.window[data-app-id="racer-lab"]')!==null
                  &&getComputedStyle(lab).position==='relative':
                    getComputedStyle(lab).position==='fixed');
               result.nativeWorkshop=!nativeTest||lab.classList.contains('er-lab-native');
               const speed=lab.querySelector('[data-lab-id="baseSpeed"]');
               const setSpeed=(n)=>{
                 speed.value=String(n);
                 speed.dispatchEvent(new Event('input',{bubbles:true}));
               };
               // Edit P1 while P3 runs. Different profiles must not overwrite
               // the active run until the phase is explicitly previewed.
               lab.querySelector('[data-phase="p1"]').click();
               setSpeed(8);
               const padSlider=lab.querySelector('[data-lab-id="boostPadSpeed"]');
               const setPad=(n)=>{
                 padSlider.value=String(n);
                 padSlider.dispatchEvent(new Event('input',{bubbles:true}));
               };
               setPad(1.25);
               result.padSpeedP1=debug.snapshot().phaseProfiles.p1.boostPadSpeed===1.25
                 &&debug.snapshot().phaseProfiles.p3.boostPadSpeed!==1.25;
               result.phaseIndependent=debug.snapshot().phaseProfiles.p1.baseSpeed===8
                 &&debug.snapshot().phaseProfiles.p3.baseSpeed!==8;
               lab.querySelector('.er-lab-try-phase').click();
               result.previewP1=debug.snapshot().phaseActive==='p1'
                 &&debug.snapshot().testMode&&debug.snapshot().encore.mode==='normal';
               lab.querySelector('[data-phase="p2"]').click();
               setSpeed(9);
               setPad(2.7);
               lab.querySelector('.er-lab-try-phase').click();
               result.padSpeedP2Active=debug.snapshot().lab.boostPadSpeed===2.7
                 &&debug.snapshot().phaseProfiles.p1.boostPadSpeed===1.25;
               result.previewP2=debug.snapshot().phaseActive==='p2'
                 &&debug.snapshot().testMode&&debug.snapshot().directorStage>=2
                 &&debug.snapshot().encore.mode==='normal';
               lab.querySelector('[data-phase="p3"]').click();
               setSpeed(8.5);
               setPad(1.6);
               lab.querySelector('.er-lab-try-phase').click();
               result.padSpeedP3Active=debug.snapshot().lab.boostPadSpeed===1.6
                 &&debug.snapshot().phaseProfiles.p2.boostPadSpeed===2.7;
               result.previewP3=debug.snapshot().phaseActive==='p3'
                 &&debug.snapshot().testMode&&debug.snapshot().encore.mode==='blue'
                 &&debug.snapshot().lab.baseSpeed===8.5;
               // Prove the user-selected phase 3 colour changes actual tunnel
               // pixels, including the background (not only the rails).
               const canvas=host.querySelector('canvas');
               const sampleTunnel=()=>{
                 debug.draw();
                 const ctx=canvas.getContext('2d');
                 const samples=[];
                 for(let y=1;y<=5;y++)for(let x=1;x<=7;x++){
                   const p=ctx.getImageData(Math.floor(canvas.width*x/8),
                     Math.floor(canvas.height*y/6),1,1).data;
                   samples.push(p[0],p[1],p[2]);
                 }
                 return samples;
               };
               const originalTunnel=sampleTunnel();
               const mainPicker=lab.querySelector('[data-lab-id="colorMain"]');
               lab.querySelector('[data-category="PALETTE DE LA PHASE"]').click();
               mainPicker.value='#ffc020';
               mainPicker.dispatchEvent(new Event('input',{bubbles:true}));
               const changedTunnel=sampleTunnel();
               const pixelDelta=changedTunnel.reduce((sum,n,i)=>
                 sum+Math.abs(n-originalTunnel[i]),0);
               result.phase3ThemeEditable=debug.snapshot().phaseProfiles.p3.colorMain==='#ffc020'
                 &&pixelDelta>100;
               result.otherPhasesKeepColors=debug.snapshot().phaseProfiles.p1.colorMain!=='#ffc020'
                 &&debug.snapshot().phaseProfiles.p2.colorMain!=='#ffc020';
               // A pad can be removed while flying without affecting manual nitro.
               lab.querySelector('[data-category="TURBOS & BONUS"]').click();
               debug.injectPickup('pad',[0,1,2]);
               const padToggle=lab.querySelector('[data-lab-id="boostPadsEnabled"]');
               padToggle.checked=false;
               padToggle.dispatchEvent(new Event('change',{bubbles:true}));
               result.padToggleImmediate=debug.snapshot().phaseProfiles.p3.boostPadsEnabled===false
                 &&debug.snapshot().lab.boostPadsEnabled===false
                 &&debug.snapshot().pads.length===0
                 &&debug.snapshot().padBoostTime===0;
               for(let i=0;i<15;i++)debug.advance(.04);
               result.noPadsWhileDisabled=debug.snapshot().pads.length===0
                 &&debug.snapshot().phaseProfiles.p2.boostPadsEnabled===true;
               const profile=lab.querySelector('.er-lab-presets button');
               profile.click();
               result.performancePreset=debug.snapshot().lab.renderScale===.65&&
                 debug.snapshot().phaseProfiles.p3.lineCount===8;
               lab.querySelector('.er-lab-reset').click();
               result.resetDefaults=debug.snapshot().phaseProfiles.p3.baseSpeed===6.15;
               lab.querySelector('.er-lab-export-button').click();
               const exported=JSON.parse(lab.querySelector('.er-lab-export-text').value);
               result.phaseExport=exported.version===3&&
                 exported.phases.p1.baseSpeed===8&&
                 exported.phases.p2.baseSpeed===9&&
                 exported.phases.p3.baseSpeed===6.15&&
                 exported.phases.p1.boostPadSpeed===1.25&&
                 exported.phases.p2.boostPadSpeed===2.7&&
                 exported.phases.p3.boostPadSpeed===1.85&&
                 exported.phases.p3.boostPadsEnabled===true&&
                 exported.phases.p1.boostPadsEnabled===true&&
                 typeof exported.common.renderScale==='number';
               result.liveTuning=true;
               lab.querySelector('.er-lab-close').click();
               result.closeDetached=lab.hidden&&!lab.isConnected;
             }else{
               for(const key of ['detachedWorkshop','nativeWorkshop','phaseIndependent','padSpeedP1',
                 'padSpeedP2Active','padSpeedP3Active','previewP1','previewP2',
                 'previewP3','phase3ThemeEditable','otherPhasesKeepColors',
                 'padToggleImmediate','noPadsWhileDisabled','performancePreset',
                 'resetDefaults','phaseExport','closeDetached','liveTuning']){
                 result[key]=true;
               }
             }
             for(let i=0;i<20;i++)debug.advance(.04);
             debug.menu();
             result.testBestSafe=debug.snapshot().best===oldBest&&!debug.snapshot().testMode;
             // Keyboard/controller home navigation can select TEST without touching.
             debug.controller('down');debug.controller('pulse');
             result.controllerTest=debug.snapshot().testMode&&debug.snapshot().encore.mode==='blue';
             debug.menu();
             result.plasticFooter=getComputedStyle(footer).backgroundImage.includes('data:image/webp');
             result.desktopButtonsReadable=Array.from(footer.querySelectorAll('.er-hardware')).every(el=>{
               const st=getComputedStyle(el);
               return Number.parseFloat(st.fontSize)>=10&&st.color!=='rgba(0, 0, 0, 0)'&&el.textContent.trim().length>0;
             });
             result.plasticMobile=getComputedStyle(pad).backgroundImage.includes('data:image/webp');
             result.noZebra=/data:image\/webp/.test(getComputedStyle(footer).backgroundImage)
               &&!getComputedStyle(footer).backgroundImage.includes('textile');
             button.click();
             result.directPlay=debug.snapshot().mode==='running';
             for(let i=0;i<8;i++)debug.advance(.04);
             const snap=debug.snapshot();
             result.runStarted=snap.score>0&&snap.currentSpeed>0&&snap.mode==='running';
             result.patterns=Array.from({length:28},(_,k)=>window.ZebraEchoRacer.pattern(k)).every(a=>a.length>0&&a.length<16);
             result.noRenderError=!debug.lastRenderError();
             result.clearGameplayGlass=getComputedStyle(host.querySelector('.er-crt')).display==='none'
               &&getComputedStyle(host.querySelector('.er-screen'),'::before').content==='none';
             // Verify an ordinary non-turbo run already feels fast.
             for(let i=0;i<85;i++)debug.advance(.04);
             result.cruiseWithoutTurbo=debug.snapshot().currentSpeed>5.7
               &&!debug.gauges().manualBoost;
             // Transition must be hazard-free and exactly five game seconds.
             debug.triggerEncore();
             const first=debug.snapshot();
             for(let i=0;i<55;i++)debug.advance(.04);
             const dark=debug.snapshot();
             for(let i=0;i<70;i++)debug.advance(.04);
             const blue=debug.snapshot();
             result.transitionStartsClear=first.encore.mode==='transition'
               &&first.waves.length===0&&first.shields.length===0&&first.pads.length===0;
             result.midwayBlack=dark.encore.mode==='transition'
               &&dark.encore.visibility===0&&dark.waves.length===0;
             result.fiveSecondReveal=blue.encore.mode==='blue'
               &&blue.encore.visibility===1&&blue.encore.blue;
             result.modestBlueSpeed=blue.currentSpeed>5.7&&blue.currentSpeed<15
               &&!debug.gauges().manualBoost;
             result.noCrashInTransition=blue.lives===first.lives;
             debug.draw();
             result.blueTunnelRendered=!debug.lastRenderError();
             // The two Game Over artwork buttons must occupy exactly one size.
             debug.simulateHit();debug.simulateHit();debug.simulateHit();
             debug.tickDeath(1.2);
             const over=host.querySelector('.er-overlay-button');
             const menu=host.querySelector('.er-menu-back');
             const ar=over.getBoundingClientRect(),mr=menu.getBoundingClientRect();
             const cs1=getComputedStyle(over),cs2=getComputedStyle(menu);
             result.gameOverButtonsEqual=debug.snapshot().mode==='over'&&
               Math.abs(parseFloat(cs1.width)-parseFloat(cs2.width))<2&&
               Math.abs(parseFloat(cs1.height)-parseFloat(cs2.height))<2;
             result.errors=errors;
             document.body.dataset.check=JSON.stringify(result);
             document.body.dataset.pass=Object.entries(result).every(([k,v])=>k==='errors'?v.length===0:v===true)?'ok':'failed';
            }catch(e){document.body.dataset.pass='exception';document.body.dataset.check=String(e.stack||e);}
           });
          </script></body></html>
          HTML
          python3 -m http.server 8765 >/tmp/echo-endless-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          for v in desktop mobile; do
            if [ "$v" = mobile ]; then RES="--window-size=420,1000"; else RES="--window-size=1020,900"; fi
            google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2500 $RES \
              --dump-dom "http://127.0.0.1:8765/_verify_echo_endless.html$(if [ "$v" = desktop ]; then printf '?nativeLab=1'; fi)" >/tmp/echo-endless-${v}.html 2>/tmp/echo-endless-${v}.err
            echo "ENDLESS_BROWSER_${v}=$(grep -o 'data-pass="[^"]*"' /tmp/echo-endless-${v}.html | head -1)"
            grep -o 'data-check="[^"]*"' /tmp/echo-endless-${v}.html | head -1
            grep -q 'data-pass="ok"' /tmp/echo-endless-${v}.html
            google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=900 $RES \
              --screenshot="/tmp/echo-endless-${v}.png" "http://127.0.0.1:8765/_verify_echo_endless.html" >/dev/null 2>&1
          done
      - name: Garder les captures de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: echo-endless-browser-screens
          path: |
            /tmp/echo-endless-desktop.png
            /tmp/echo-endless-mobile.png
          if-no-files-found: ignore
