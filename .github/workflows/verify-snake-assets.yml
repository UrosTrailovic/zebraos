name: Vérifier Zebra Snake
on:
  push:
    paths:
      - snake.js
      - snake.css
      - assets/games/snake/**
      - assets/fonts/zebra-videotex.woff
      - tests/snake.test.cjs
      - .github/workflows/verify-snake-assets.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check snake.js && node --test tests/snake.test.cjs
      - name: Plateau et commandes sur mobile et bureau
        run: |
          cat > _verify_snake.html <<'HTML'
          <!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="snake.css"><style>html,body{margin:0;width:100%;height:100%}#test{position:fixed;inset:0;display:block;width:100%;height:100%;padding:0}</style><div id="test" class="window-body zebra-game-body"></div><script src="snake.js"></script><script>
          window.addEventListener('load',async()=>{
           const out={},host=document.querySelector('#test'),wait=ms=>new Promise(r=>setTimeout(r,ms));
           try{
            localStorage.setItem('zebra.snake.theme','night');ZebraSnake.mount(host);await wait(150);
            const $=q=>host.querySelector(q),stage=$('.zs-stage'),bounds=stage.getBoundingClientRect(),consoleBounds=$('.zs-console').getBoundingClientRect();
            const hudBounds=$('.zs-hud').getBoundingClientRect();out.hudAligned=Math.abs(hudBounds.left-bounds.left)<1&&Math.abs(hudBounds.right-bounds.right)<1;
            out.fits=bounds.width>100&&bounds.height>90&&bounds.left>=0&&bounds.right<=innerWidth&&consoleBounds.bottom<=innerHeight+1;
            const ctx=$('canvas').getContext('2d');out.drawn=ctx.getImageData(160,160,1,1).data[3]===255;
            const image=new Image();image.src='/assets/games/snake/tileSnake.png';await image.decode();out.tile=image.naturalWidth===32&&getComputedStyle($('.zs-machine')).backgroundImage.includes('tileSnake');
            await document.fonts.load('16px "Zebra Videotex"');
            out.font=document.fonts.check('16px "Zebra Videotex"');
            const clean=e=>{const s=getComputedStyle(e);return s.backgroundColor==='rgba(0, 0, 0, 0)'&&s.backgroundImage==='none'&&s.boxShadow==='none'&&s.borderTopWidth==='0px'};
            out.bare=!$('.zs-header')&&!$('.zs-logo')&&clean($('.zs-hud'))&&clean($('.zs-console'))&&clean(stage)&&clean($('.zs-overlay'));
            out.noBricks=$('canvas').width===384&&$('canvas').height===320;
            out.ready=$('.zs-state').textContent==='PRÊT';
            const ground=ctx.getImageData(0,0,1,1).data;out.groveOnly=!$('.zs-themes')&&!$('.zs-theme')&&ground[1]>100&&ground[0]<70&&ground[2]<70;
            $('.zs-play').click();out.play=$('.zs-state').textContent==='EN JEU'&&$('.zs-overlay').hidden;
            $('.zs-play').click();out.pause=$('.zs-state').textContent==='PAUSE'&&!$('.zs-overlay').hidden;
            $('.zs-menu').click();$('.zs-up').dispatchEvent(new PointerEvent('pointerdown',{button:0,bubbles:true}));out.direction=$('.zs-state').textContent==='EN JEU';
            document.dispatchEvent(new KeyboardEvent('keydown',{key:' ',code:'Space',bubbles:true}));out.keyboard=$('.zs-state').textContent==='PAUSE';
            $('.zs-restart').click();out.restart=$('.zs-state').textContent==='EN JEU'&&$('.zs-score').textContent==='0000';
            out.mobile=innerWidth>700||getComputedStyle($('.zs-handheld')).display==='grid';
            if(innerWidth<=700){
             // A Tetris DOM fixture uses its real production CSS at the same size.
             const ref=document.createElement('div');ref.className='window-body zebra-game-body';ref.style.cssText='position:fixed;left:-10000px;top:0;padding:0;width:'+host.clientWidth+'px;height:'+host.clientHeight+'px';
             const retro=document.createElement('div');retro.className='zg zg-retro';
             const fill=document.createElement('div');fill.style.cssText='flex:1;min-height:0';
             const clone=$('.zs-handheld').cloneNode(true);
             for(const e of [clone,...clone.querySelectorAll('[class]')])e.className=e.className.split(' ').filter(c=>!c.startsWith('zs-')).join(' ');
             retro.append(fill,clone);ref.append(retro);document.body.append(ref);
             const origin=host.getBoundingClientRect(),refOrigin=ref.getBoundingClientRect();
             const pairs=[['.zs-cross','.zt-cross'],['.zs-up','.zt-dir-up'],['.zs-down','.zt-dir-down'],['.zs-left','.zt-dir-left'],['.zs-right','.zt-dir-right'],['.zs-a','.zt-a'],['.zs-b','.zt-b']];
             out.tetrisGeometry=pairs.every(([a,b])=>{
              const actual=$(a).getBoundingClientRect(),expected=ref.querySelector(b).getBoundingClientRect();
              return Math.abs(actual.width-expected.width)<1&&Math.abs(actual.height-expected.height)<1&&Math.abs((actual.left-origin.left)-(expected.left-refOrigin.left))<1&&Math.abs((actual.top-origin.top)-(expected.top-refOrigin.top))<1;
             });
             out.diagonal=$('.zs-a').getBoundingClientRect().top<$('.zs-b').getBoundingClientRect().top;
             out.visibleControls=Array.from(host.querySelectorAll('.zs-dir,.zs-ab button')).every(b=>{const r=b.getBoundingClientRect();const s=getComputedStyle(b);return r.width>=30&&r.height>=30&&r.left>=0&&r.right<=innerWidth&&s.color!=='rgba(0, 0, 0, 0)'});
             out.noControlPanel=getComputedStyle($('.zs-handheld'),'::before').display==='none';
             ref.remove();
            }
            host._zebraDispose();await wait(320);out.dispose=$('.zs-state').textContent==='EN JEU';
           }catch(e){out.error=String(e.stack||e)}
           document.documentElement.dataset.snakeReport=JSON.stringify(out);document.documentElement.dataset.snakeStatus=Object.values(out).every(v=>v===true)?'ok':'failed';
          });
          </script>
          HTML
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/snake-server.log 2>&1 &
          sleep 1
          for size in 390,740 1160,900; do
            google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=$size --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/_verify_snake.html > /tmp/snake-$size.html 2>/tmp/snake-$size.log
            grep -o 'data-snake-report="[^"]*"' /tmp/snake-$size.html
            grep -q 'data-snake-status="ok"' /tmp/snake-$size.html
          done
