name: Actualiser le bureau ZebraOS

on:
  push:
    branches: [main]
    paths:
      - 'STUDIO/BUREAU/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index-bureau:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Construire l'index du bureau
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("STUDIO/BUREAU")
          entries = []
          # Les *.zebraos.json sont de VRAIS fichiers GitHub servant de raccourcis.
          # L'index publie leurs noms et IDs d'app, sans les traiter comme du texte.
          apps = {
              "explorer:root", "explorer:recycle", "studio-manager",
              "amp", "settings", "tetris", "snake", "racer", "paint", "calc",
              "sticky", "planner", "notepad"
          }
          icons = {
              "computer", "recycle-bin", "zebraamp", "control-panel",
              "tetris", "snake", "racer", "paint", "calc", "sticky", "planner",
              "txt", "folder"
          }
          for path in sorted(root.rglob("*")):
              if path.name.startswith("."):
                  continue
              if any(part.startswith(".") for part in path.parts):
                  continue
              if path.is_file() and path.name.endswith(".zebraos.json"):
                  config = json.loads(path.read_text(encoding="utf-8"))
                  if config.get("app") not in apps:
                      raise ValueError(f"Raccourci inconnu : {path}")
                  title = config.get("name", path.name[:-13])
                  if not isinstance(title, str) or not title.strip():
                      raise ValueError(f"Nom de raccourci invalide : {path}")
                  item = {
                      "path": path.as_posix(),
                      "type": "app",
                      "name": title[:90],
                      "app": config["app"],
                      "icon": config.get("icon") if config.get("icon") in icons else "txt",
                  }
                  if "sessions" in config:
                      if not isinstance(config["sessions"], list):
                          raise ValueError(f"Sessions invalides : {path}")
                      item["sessions"] = [
                          entry for entry in config["sessions"]
                          if entry in {"admin", "visitor", "zebra", "daniel"}
                      ]
                  entries.append(item)
                  continue
              entries.append({
                  "path": path.as_posix(),
                  "type": "dir" if path.is_dir() else "file",
                  **({} if path.is_dir() else {"size": path.stat().st_size})
              })
          # Ordre par défaut pour TOUS les nouveaux bureaux ZebraOS.
          # Les noms correspondent exactement aux libellés affichés sur le bureau.
          # Les dossiers non listés continuent à apparaître après les prioritaires.
          order_file = root / ".ordre-bureau.json"
          desktop_order = []
          if order_file.exists():
              config = json.loads(order_file.read_text(encoding="utf-8"))
              if not isinstance(config, dict) or not isinstance(config.get("ordre"), list):
                  raise ValueError("STUDIO/BUREAU/.ordre-bureau.json : champ ordre requis (liste)")
              for name in config["ordre"]:
                  if not isinstance(name, str) or not name.strip() or len(name) > 120:
                      raise ValueError(f"Nom invalide dans .ordre-bureau.json : {name!r}")
                  if name.casefold() not in [n.casefold() for n in desktop_order]:
                      desktop_order.append(name)
          output = Path("assets/bureau-index.json")
          output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps({
              "version": 1,
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "desktopOrder": desktop_order,
              "entries": entries
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publier l'index actualisé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bureau-index.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualiser le bureau public ZebraOS"
            git push
          fi
