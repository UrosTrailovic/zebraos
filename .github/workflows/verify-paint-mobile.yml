name: Vérifier ZebraPaint mobile
on:
  push:
    paths:
      - 'paint.js'
      - 'paint-responsive.css'
      - 'index.html'
      - '.github/workflows/verify-paint-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paint-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le JavaScript
        run: node --check paint.js
      - name: Tester sur Chromium tactile un mini Photoshop à calques
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('index.html').read_text()
          checks=r'''<script>
          window.addEventListener("load",async()=>{
            const test={},sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            try{
              const host=document.createElement("div");
              host.id="paint-test-host";host.className="zebra-game-body";
              host.style.cssText="position:absolute;top:8px;left:8px;width:350px;height:590px;z-index:9999;overflow:hidden;";
              document.body.appendChild(host);
              const symbol=document.querySelector(".zboot-power-svg");
              test.powerSvg=!!symbol&&getComputedStyle(symbol).display!=="none";
              window.ZebraPaint.mount(host);
              const frame=host.querySelector(".zp-canvas-frame");
              const base=host.querySelector(".zp-canvas");
              const area=host.querySelector(".zp-work").getBoundingClientRect();
              test.mobileFit=frame.getBoundingClientRect().width<=area.width+1
                &&base.width===640&&base.height===400;
              const buttons=()=>Array.from(host.querySelectorAll(".zp-tool"));
              const tool=name=>buttons().find(b=>b.getAttribute("aria-label")===name).click();
              const labels=()=>Array.from(host.querySelectorAll(".zp-layer-name")).map(e=>e.textContent);
              const select=name=>{
               const row=Array.from(host.querySelectorAll(".zp-layer-entry")).find(r=>r.textContent.includes(name));
               if(!row)throw Error("Calque absent "+name+": "+labels());
               row.querySelector(".zp-layer-choice").click();return row;
              };
              const fire=(type,x,y,target=base,pointerId=77)=>{
                const ev=new PointerEvent(type,{bubbles:true,cancelable:true,isPrimary:true,
                  pointerId,pointerType:"touch",button:0,clientX:x,clientY:y});
                target.dispatchEvent(ev);
              };
              const coord=(x,y)=>{
                const r=frame.getBoundingClientRect();
                return {x:r.left+x/640*r.width,y:r.top+y/400*r.height};
              };
              const stroke=(x1,y1,x2,y2,selector=base)=>{
                const a=coord(x1,y1),b=coord(x2,y2);
                fire("pointerdown",a.x,a.y,selector);
                fire("pointermove",b.x,b.y,window);
                // Canvas handlers listen on the canvas, not on window, unless dragging an image.
                if(selector===base)fire("pointermove",b.x,b.y,base);
                fire("pointerup",b.x,b.y,selector===base?base:window);
              };
              const sample=(x,y)=>{
                const canvas=host.querySelector(".zp-raster-layer");
                return Array.from(canvas.getContext("2d").getImageData(x,y,1,1).data);
              };
              test.clearTools=buttons().length>=9
                &&buttons().every(b=>!!b.querySelector("svg")&&!!b.querySelector(".zp-tool-name"))
                &&buttons().some(b=>b.textContent==="Gomme");
              test.initialLayers=labels().some(s=>s.includes("Fond"))
                &&labels().some(s=>s.includes("Dessin"));
              select("Fond");
              const color=host.querySelector('input[type=color]');
              color.value="#e90000";color.dispatchEvent(new Event("input",{bubbles:true}));
              tool("Remplir");
              const middle=coord(320,200);
              fire("pointerdown",middle.x,middle.y);
              test.redBackground=sample(320,200)[0]>210&&sample(320,200)[1]<20;
              const c=document.createElement("canvas");c.width=300;c.height=200;
              const cx=c.getContext("2d");cx.fillStyle="#0000ff";cx.fillRect(0,0,300,200);
              const blob=await new Promise(resolve=>c.toBlob(resolve,"image/png"));
              const inp=host.querySelector('input[type=file]');
              Object.defineProperty(inp,"files",{configurable:true,
                value:[new File([blob],"photo-bleue.png",{type:"image/png"})]});
              inp.dispatchEvent(new Event("change",{bubbles:true}));
              await sleep(260);
              const image=host.querySelector(".zp-imported-image");
              test.photoLayer=!!image&&labels().some(s=>s.includes("photo-bleue"));
              const surface=image.querySelector("canvas");
              test.imagePreview=!!surface&&surface.width>0&&surface.height>0;
              test.imageLayerBetween=Array.from(host.querySelector(".zp-layer-stage").children)
                .map(e=>e.className).join("|").includes("zp-imported-image")
                &&labels().length===3;
              tool("Gomme");
              const sizeInput=host.querySelector(".zp-size input");
              sizeInput.value="60";sizeInput.dispatchEvent(new Event("input",{bubbles:true}));
              stroke(310,200,335,200);
              const centerpix=surface.getContext("2d").getImageData(150,100,1,1).data;
              test.photoErased=centerpix[3]===0;
              host.querySelector(".zp-edits button").click();
              const restored=surface.getContext("2d").getImageData(150,100,1,1).data;
              test.eraseUndo=restored[2]>200&&restored[3]===255;
              tool("Gomme");stroke(310,200,335,200);
              const scaler=host.querySelector(".zp-scale-input");
              test.scaleExists=!!scaler&&scaler.max==="500";
              scaler.value="500";scaler.dispatchEvent(new Event("change",{bubbles:true}));
              test.beyondCanvas=parseFloat(image.style.width)>100
                &&image.getBoundingClientRect().width>frame.getBoundingClientRect().width;
              // Ramener à 100% pour valider ensuite l'empilement et la peinture.
              scaler.value="100";scaler.dispatchEvent(new Event("change",{bubbles:true}));
              select("Dessin");
              color.value="#000000";color.dispatchEvent(new Event("input",{bubbles:true}));
              tool("Crayon");
              const sizeSmall=host.querySelector(".zp-size input");sizeSmall.value="20";
              sizeSmall.dispatchEvent(new Event("input",{bubbles:true}));
              stroke(300,170,340,170);
              const raster=Array.from(host.querySelectorAll(".zp-raster-layer"))[1];
              const black=raster.getContext("2d").getImageData(320,170,1,1).data;
              test.drawOverPhoto=black[3]>100&&black[0]<55;
              // Export PNG et vérifier que les couleurs se composent.
              let png="";
              function capture(e){
                const a=e.target.closest("a[download]");
                if(a&&a.download.startsWith("zebra-paint-")){png=a.href;e.preventDefault();}
              }
              document.addEventListener("click",capture,true);
              host.querySelector(".zp-menu button[download]")?.click();
              if(!png)Array.from(host.querySelectorAll(".zp-menu button")).find(b=>b.textContent.includes("PNG")).click();
              document.removeEventListener("click",capture,true);
              test.exportPNG=png.startsWith("data:image/png;base64,");
              if(test.exportPNG){
                const res=new Image();
                await new Promise(resolve=>{res.onload=resolve;res.onerror=resolve;res.src=png;});
                const off=document.createElement("canvas");off.width=640;off.height=400;
                const out=off.getContext("2d");out.drawImage(res,0,0);
                const px=(x,y)=>Array.from(out.getImageData(x,y,1,1).data);
                const bottom=px(30,30),photo=px(285,170),strokePx=px(320,170),erased=px(320,200);
                test.exportOrder=bottom[0]>200&&bottom[2]<30
                  &&photo[2]>200&&photo[0]<30
                  &&strokePx[0]<50&&strokePx[1]<50&&strokePx[2]<50;
                test.exportErasure=erased[0]>200&&erased[2]<30;
              }else{test.exportOrder=false;test.exportErasure=false;}
            }catch(e){test.error=String(e.stack||e);}
            document.documentElement.dataset.paintReport=JSON.stringify(test);
            document.documentElement.dataset.paintStatus=Object.values(test).every(v=>v===true)?"ok":"failed";
          });
          </script>'''
          Path("_verify_paint_mobile.html").write_text(html.replace("</body>",checks+"</body>"))
          PY
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/zebra-paint-server.log 2>&1 &
          sleep 1
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --touch-events=enabled --window-size=390,900 --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8765/_verify_paint_mobile.html > /tmp/zebra-paint-mobile.html 2>/tmp/zebra-paint-chrome.log
          grep -o 'data-paint-report="[^"]*"' /tmp/zebra-paint-mobile.html | tail -c 4500
          grep -o 'data-paint-status="[^"]*"' /tmp/zebra-paint-mobile.html
          grep -q 'data-paint-status="ok"' /tmp/zebra-paint-mobile.html
