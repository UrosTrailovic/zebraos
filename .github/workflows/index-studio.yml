name: Actualiser la bibliothèque ZebraOS

on:
  push:
    branches:
      - main
    paths:
      - 'STUDIO/**'
      - '!STUDIO/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index-public:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Générer l'index des fichiers publiés
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("STUDIO")
          entries = []
          for path in sorted(root.rglob("*")):
              if path.name.startswith(".") or path.name == "manifest.json":
                  continue
              if any(part.startswith(".") for part in path.parts):
                  continue
              entries.append({
                  "path": path.as_posix(),
                  "type": "dir" if path.is_dir() else "file",
                  **({} if path.is_dir() else {"size": path.stat().st_size})
              })

          manifest = {"version": 2, "entries": entries}
          (root / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Enregistrer l'index actualisé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STUDIO/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: mettre à jour l'index public ZebraOS"
            git push
          fi
